name: Export PR21 Source

on:
  push:
    branches:
      - agent/complete-bug-audit-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive
        run: |
          git archive --format=zip --output=lightbridge-pr21-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: lightbridge-pr21-source
          path: lightbridge-pr21-source.zip
          if-no-files-found: error
          retention-days: 1

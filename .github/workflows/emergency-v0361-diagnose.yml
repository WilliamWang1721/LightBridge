name: Emergency v0.3.61 verified repair

on:
  push:
    branches: [agent/emergency-v0.3.61]
    paths: [.github/workflows/emergency-v0361-diagnose.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-v0361-verified-repair
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/emergency-v0.3.61
          fetch-depth: 0

      - name: Apply reviewed production fixes and test-race repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/emergency-v0361-review.yml').read_text()
          marker = '      - name: Apply reviewed fixes\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - uses:', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          Path('/tmp/apply-reviewed-fixes.sh').write_text(script)
          PY
          bash -n /tmp/apply-reviewed-fixes.sh
          bash /tmp/apply-reviewed-fixes.sh 2>&1 | tee /tmp/apply-reviewed-fixes.log

          python3 - <<'PY'
          from pathlib import Path

          usage = Path('backend/internal/service/usage_cleanup_service_test.go')
          text = usage.read_text()
          replacements = [
              ('\t"sync"\n', '\t"sync"\n\t"sync/atomic"\n', 1),
              ('\trecomputeCalls int\n', '\trecomputeCalls atomic.Int32\n', 1),
              ('\ts.recomputeCalls++\n', '\ts.recomputeCalls.Add(1)\n', 1),
              ('dashboardRepo.recomputeCalls == 1', 'dashboardRepo.recomputeCalls.Load() == 1', 2),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{usage}: expected {expected} occurrence(s), found {count}: {old!r}')
              text = text.replace(old, new)
          usage.write_text(text)

          target = '\tgin.SetMode(gin.TestMode)\n'
          changed = []
          removed = 0
          for path in sorted(Path('backend/internal/service').glob('*_test.go')):
              if path.name == 'gin_test_mode_test.go':
                  continue
              text = path.read_text()
              count = text.count(target)
              if count == 0:
                  continue
              text = text.replace(target, '')
              if 'gin.' not in text:
                  text = text.replace('\t"github.com/gin-gonic/gin"\n', '')
                  text = text.replace('import "github.com/gin-gonic/gin"\n', '')
                  text = text.replace('import (\n)\n', '')
              path.write_text(text)
              removed += count
              changed.append(str(path))
          if removed < 3:
              raise SystemExit(f'expected at least 3 service-test Gin mode writes, found {removed}')
          Path('/tmp/gin-mode-files.txt').write_text('\n'.join(changed) + '\n')
          print(f'removed {removed} Gin mode writes from {len(changed)} service test files')

          Path('backend/internal/service/gin_test_mode_test.go').write_text('''//go:build unit

          package service

          import "github.com/gin-gonic/gin"

          func init() {
          \tgin.SetMode(gin.TestMode)
          }
          ''')
          PY

          mapfile -t gin_mode_files < /tmp/gin-mode-files.txt
          gofmt -w \
            backend/internal/service/usage_cleanup_service_test.go \
            backend/internal/service/gin_test_mode_test.go \
            "${gin_mode_files[@]}"

          git add -N \
            backend/internal/service/backup_shutdown_test.go \
            backend/internal/service/gin_test_mode_test.go
          python3 tools/codebase_inventory.py
          python3 tools/codebase_inventory.py --check
          git diff --check
          git status --short

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'

      - name: Backend unit tests
        run: |
          set -o pipefail
          make -C backend test-unit 2>&1 | tee /tmp/backend-unit.log

      - name: Backend integration tests
        run: |
          set -o pipefail
          make -C backend test-integration 2>&1 | tee /tmp/backend-integration.log

      - name: Backend race tests
        run: |
          set -o pipefail
          go -C backend test -race -tags=unit ./internal/service ./internal/repository ./internal/handler/... 2>&1 | tee /tmp/backend-race.log

      - name: Backend lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

      - name: Secret scan
        run: |
          set -o pipefail
          make secret-scan 2>&1 | tee /tmp/secret-scan.log

      - name: Release configuration validation
        run: |
          set -o pipefail
          python3 tools/validate_release_configuration.py 2>&1 | tee /tmp/release-validation.log

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend tests
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm test:run 2>&1 | tee /tmp/frontend-tests.log

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/frontend-typecheck.log

      - name: Frontend lint
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm lint:check 2>&1 | tee /tmp/frontend-lint.log

      - name: Frontend production build
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/frontend-build.log

      - name: Commit verified repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No verified source changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix: harden backups distributions and v0.3.61 release'
          git push origin HEAD:agent/emergency-v0.3.61

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergency-v0361-verified-repair-logs
          path: |
            /tmp/apply-reviewed-fixes.log
            /tmp/backend-unit.log
            /tmp/backend-integration.log
            /tmp/backend-race.log
            /tmp/secret-scan.log
            /tmp/release-validation.log
            /tmp/frontend-tests.log
            /tmp/frontend-typecheck.log
            /tmp/frontend-lint.log
            /tmp/frontend-build.log
          if-no-files-found: ignore
          retention-days: 3

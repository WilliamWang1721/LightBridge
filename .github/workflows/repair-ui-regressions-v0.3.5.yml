name: Repair v0.3.5 UI regressions

on:
  push:
    branches:
      - main
    paths:
      - '.github/repair-triggers/ui-regressions-v0.3.5'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-ui-regressions-v0.3.5
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: fix/ui-regressions-v0.3.5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply UI fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          template_path = Path('frontend/src/components/account/templates/CreateAccountModal.template.html')
          template = template_path.read_text(encoding='utf-8')
          start_marker = '      <!-- Custom Provider Configuration -->'
          end_marker = '      <!-- LightBridge Connect Configuration (for New API and compatible services) -->'
          start = template.index(start_marker)
          end = template.index(end_marker)
          custom_section = '''      <!-- Custom Provider Configuration -->
      <section
        v-if="form.platform === 'custom'"
        class="space-y-5 rounded-xl border border-gray-200 bg-gray-50/70 p-4 dark:border-dark-600 dark:bg-dark-800/40"
        data-testid="custom-connection-settings"
      >
        <div>
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white">
            {{ t('admin.accounts.custom.connectionSectionTitle') }}
          </h3>
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
            {{ t('admin.accounts.custom.connectionSectionHint') }}
          </p>
        </div>

        <div>
          <label class="input-label">{{ t('admin.accounts.custom.preset') }}</label>
          <select v-model="selectedPreset" @change="applyPreset" class="input">
            <option value="">{{ t('admin.accounts.custom.selectPreset') }}</option>
            <optgroup :label="t('admin.accounts.custom.presetGroups.openaiChat')">
              <option
                v-for="preset in presetsByProtocol['openai-chat']"
                :key="preset.id"
                :value="preset.id"
              >
                {{ preset.name }}
              </option>
            </optgroup>
            <optgroup :label="t('admin.accounts.custom.presetGroups.openaiResponses')">
              <option
                v-for="preset in presetsByProtocol['openai-responses']"
                :key="preset.id"
                :value="preset.id"
              >
                {{ preset.name }}
              </option>
            </optgroup>
            <optgroup :label="t('admin.accounts.custom.presetGroups.openaiEmbeddings')">
              <option
                v-for="preset in presetsByProtocol['openai-embeddings']"
                :key="preset.id"
                :value="preset.id"
              >
                {{ preset.name }}
              </option>
            </optgroup>
            <optgroup :label="t('admin.accounts.custom.presetGroups.anthropic')">
              <option
                v-for="preset in presetsByProtocol['anthropic']"
                :key="preset.id"
                :value="preset.id"
              >
                {{ preset.name }}
              </option>
            </optgroup>
          </select>
          <p class="input-hint">{{ t('admin.accounts.custom.presetHint') }}</p>
        </div>

        <div>
          <label class="input-label">{{ t('admin.accounts.custom.protocol') }}</label>
          <select v-model="form.customProtocol" required class="input">
            <option value="">{{ t('admin.accounts.custom.selectProtocol') }}</option>
            <option value="openai_responses">{{ t('admin.accounts.custom.protocolOptions.openai_responses') }}</option>
            <option value="openai_chat_completions">{{ t('admin.accounts.custom.protocolOptions.openai_chat_completions') }}</option>
            <option value="openai_embeddings">{{ t('admin.accounts.custom.protocolOptions.openai_embeddings') }}</option>
            <option value="anthropic_messages">{{ t('admin.accounts.custom.protocolOptions.anthropic_messages') }}</option>
            <option value="gemini">{{ t('admin.accounts.custom.protocolOptions.gemini') }}</option>
          </select>
          <p class="input-hint">{{ t('admin.accounts.custom.protocolHint') }}</p>
        </div>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <div>
            <label class="input-label">{{ t('admin.accounts.custom.baseUrl') }}</label>
            <input
              v-model="form.customBaseUrl"
              type="url"
              required
              class="input"
              placeholder="https://api.example.com/v1"
            />
            <p class="input-hint">{{ t('admin.accounts.custom.baseUrlHint') }}</p>
          </div>
          <div>
            <label class="input-label">{{ t('admin.accounts.custom.modelListUrl') }}</label>
            <input
              v-model="form.customModelsUrl"
              type="url"
              class="input"
              :placeholder="t('admin.accounts.custom.modelListUrlPlaceholder')"
            />
            <p class="input-hint">{{ t('admin.accounts.custom.modelListUrlHint') }}</p>
          </div>
        </div>

        <div>
          <label class="input-label">{{ t('admin.accounts.apiKeyRequired') }}</label>
          <input
            v-model="form.customApiKey"
            type="password"
            required
            class="input font-mono"
            :placeholder="t('admin.accounts.custom.apiKeyPlaceholder')"
            data-testid="custom-api-key"
          />
          <p class="input-hint">{{ t('admin.accounts.custom.apiKeyHint') }}</p>
        </div>
      </section>

      <!-- Custom relay mode -->
      <section
        v-if="form.platform === 'custom'"
        class="space-y-4 rounded-xl border border-gray-200 p-4 dark:border-dark-600"
        data-testid="custom-routing-settings"
      >
        <div>
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white">
            {{ t('admin.accounts.custom.routingSectionTitle') }}
          </h3>
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
            {{ t('admin.accounts.custom.routingSectionHint') }}
          </p>
        </div>
        <div class="flex items-center justify-between gap-4">
          <div>
            <label class="input-label mb-0">{{ t('admin.accounts.relayMode.label') }}</label>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
              {{ t(relayModeHintKey(customRelayMode)) }}
            </p>
          </div>
          <div class="w-56">
            <Select v-model="customRelayMode" :options="relayModeOptions" />
          </div>
        </div>
      </section>

'''
          template = template[:start] + custom_section + template[end:]
          template = template.replace(
              '<template v-else>\n        <div>\n          <label class="input-label">{{ t(\'admin.accounts.apiKeyRequired\') }}</label>',
              '<template v-else-if="form.platform !== \'custom\'">\n        <div>\n          <label class="input-label">{{ t(\'admin.accounts.apiKeyRequired\') }}</label>',
              1,
          )
          if 'v-else-if="form.platform !== \'custom\'"' not in template:
              raise SystemExit('generic API key exclusion was not applied')
          template_path.write_text(template, encoding='utf-8')

          replace_once(
              'frontend/src/components/account/ModelWhitelistSelector.vue',
              '        :disabled="isSyncingUpstream"\n        class="inline-flex min-h-9 items-center justify-center rounded-lg bg-primary-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60"',
              '        :disabled="isSyncingUpstream"\n        data-testid="sync-upstream-models-button"\n        class="inline-flex min-h-9 items-center justify-center rounded-lg border border-blue-700 bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-700 dark:border-blue-400 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-400 dark:disabled:border-dark-500 dark:disabled:bg-dark-600 dark:disabled:text-gray-300"',
          )

          restart_class_old = '          class="inline-flex items-center gap-2 rounded-lg bg-green-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-green-600 disabled:cursor-not-allowed disabled:opacity-50"'
          restart_class_new = '          data-testid="restart-after-upgrade-button"\n          class="inline-flex min-w-32 items-center justify-center gap-2 rounded-lg border border-blue-700 bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-700 dark:border-blue-400 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-400 dark:disabled:border-dark-500 dark:disabled:bg-dark-600 dark:disabled:text-gray-300"'
          replace_once('frontend/src/components/common/UpgradeChangesDialog.vue', restart_class_old, restart_class_new)

          replace_once(
              'frontend/src/components/common/VersionBadge.vue',
              '                  class="flex w-full items-center justify-center gap-2 rounded-lg bg-green-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-green-600 disabled:cursor-not-allowed disabled:opacity-50"',
              '                  data-testid="version-badge-restart-button"\n                  class="flex w-full items-center justify-center gap-2 rounded-lg border border-blue-700 bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-700 dark:border-blue-400 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-400 dark:disabled:border-dark-500 dark:disabled:bg-dark-600 dark:disabled:text-gray-300"',
          )

          translations = {
              'frontend/src/i18n/locales/zh-sections/admin/accounts.ts': (
                  "      accountAddTitle: '添加自定义上游账号',",
                  "      accountAddTitle: '添加自定义上游账号',\n      connectionSectionTitle: '上游连接信息',\n      connectionSectionHint: '先选择协议并填写上游地址与唯一的 API Key。模型列表地址仅在上游使用非标准接口时填写。',\n      routingSectionTitle: '请求路由设置',\n      routingSectionHint: '配置下游请求如何转换并转发到该上游；模型范围与映射在下方单独管理。',\n      apiKeyHint: '用于访问该自定义上游，创建账号时必须填写。',",
              ),
              'frontend/src/i18n/locales/en-sections/admin/accounts.ts': (
                  "      accountAddTitle: 'Add Custom Upstream Account',",
                  "      accountAddTitle: 'Add Custom Upstream Account',\n      connectionSectionTitle: 'Upstream connection',\n      connectionSectionHint: 'Choose the protocol, then enter the upstream endpoint and the single required API key. Only set a model-list URL for non-standard discovery endpoints.',\n      routingSectionTitle: 'Request routing',\n      routingSectionHint: 'Control how downstream requests are converted and forwarded. Model access and mappings are managed separately below.',\n      apiKeyHint: 'Required credential used to access this custom upstream.',",
              ),
          }
          for path, (old, new) in translations.items():
              replace_once(path, old, new)

          test_path = Path('frontend/src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts')
          test_path.write_text('''import { describe, expect, it } from 'vitest'\nimport { readFileSync } from 'node:fs'\nimport { resolve } from 'node:path'\n\nconst template = readFileSync(\n  resolve(__dirname, '../templates/CreateAccountModal.template.html'),\n  'utf-8'\n)\n\ndescribe('CreateAccountModal custom provider UI', () => {\n  it('renders one required custom API key and excludes custom from the generic API key field', () => {\n    expect(template).toContain('data-testid="custom-api-key"')\n    expect(template).toContain('v-else-if="form.platform !== \\'custom\\'"')\n    expect(template.match(/v-model="form\\.customApiKey"/g)).toHaveLength(1)\n    expect(template.match(/v-model="apiKeyValue"/g)).toHaveLength(1)\n  })\n\n  it('groups custom connection and routing settings into separate sections', () => {\n    expect(template).toContain('data-testid="custom-connection-settings"')\n    expect(template).toContain('data-testid="custom-routing-settings"')\n    expect(template).toContain("admin.accounts.custom.connectionSectionTitle")\n    expect(template).toContain("admin.accounts.custom.routingSectionTitle")\n  })\n})\n''', encoding='utf-8')

          test_path = Path('frontend/src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts')
          test_path.write_text('''import { describe, expect, it } from 'vitest'\nimport { readFileSync } from 'node:fs'\nimport { resolve } from 'node:path'\n\nconst source = readFileSync(resolve(__dirname, '../ModelWhitelistSelector.vue'), 'utf-8')\n\ndescribe('ModelWhitelistSelector action visibility', () => {\n  it('uses a high-contrast style for upstream model sync in enabled and disabled states', () => {\n    expect(source).toContain('data-testid="sync-upstream-models-button"')\n    expect(source).toContain('bg-blue-600')\n    expect(source).toContain('disabled:bg-gray-300')\n    expect(source).toContain('disabled:text-gray-700')\n    expect(source).not.toContain('bg-primary-600 px-3 py-2 text-sm font-medium text-white')\n  })\n})\n''', encoding='utf-8')

          test_file = Path('frontend/src/components/common/__tests__/UpgradeChangesDialog.spec.ts')
          test_text = test_file.read_text(encoding='utf-8')
          needle = "    expect(restartButton).toBeDefined()\n    expect(restartButton!.element.closest('.modal-footer')).not.toBeNull()"
          replacement = "    expect(restartButton).toBeDefined()\n    expect(restartButton!.attributes('data-testid')).toBe('restart-after-upgrade-button')\n    expect(restartButton!.classes()).toContain('bg-blue-600')\n    expect(restartButton!.classes()).toContain('disabled:text-gray-700')\n    expect(restartButton!.element.closest('.modal-footer')).not.toBeNull()"
          if needle not in test_text:
              raise SystemExit('UpgradeChangesDialog test insertion point missing')
          test_file.write_text(test_text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Install frontend dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec prettier --check \
            src/components/account/templates/CreateAccountModal.template.html \
            src/components/account/ModelWhitelistSelector.vue \
            src/components/common/UpgradeChangesDialog.vue \
            src/components/common/VersionBadge.vue \
            src/i18n/locales/zh-sections/admin/accounts.ts \
            src/i18n/locales/en-sections/admin/accounts.ts \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts
          pnpm --dir frontend exec vitest run \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts \
            src/components/common/__tests__/VersionBadge.spec.ts
          pnpm --dir frontend run type-check
          pnpm --dir frontend run build
          git diff --check

      - name: Commit and push repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/components/account/templates/CreateAccountModal.template.html \
            frontend/src/components/account/ModelWhitelistSelector.vue \
            frontend/src/components/common/UpgradeChangesDialog.vue \
            frontend/src/components/common/VersionBadge.vue \
            frontend/src/i18n/locales/zh-sections/admin/accounts.ts \
            frontend/src/i18n/locales/en-sections/admin/accounts.ts \
            frontend/src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            frontend/src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts \
            frontend/src/components/common/__tests__/UpgradeChangesDialog.spec.ts
          git commit -m 'fix(ui): repair custom account form and action visibility'
          git push origin "HEAD:${TARGET_BRANCH}"

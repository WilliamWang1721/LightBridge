name: Debug PR17 V2 Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug:
    if: github.head_ref == 'fix/universal-router-diagnostics-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
      - name: Trace application
        continue-on-error: true
        run: |
          set -x
          {
            python tools/fix_pr17_checks.py
            cd backend
            go mod edit -go=1.26.5
            go get github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
            go get github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
            go mod tidy
            gofmt -w cmd internal
            cd ../frontend
            pnpm add 'xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          } > v2-apply.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr17-v2-apply-log
          path: v2-apply.log

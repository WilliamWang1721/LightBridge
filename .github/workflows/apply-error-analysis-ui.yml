name: Apply Scheduler Diagnostics UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch error analysis UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/views/admin/ops/utils/errorAnalysis.ts')
          text = path.read_text()

          def sub_once(pattern: str, replacement: str, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {pattern[:100]}')

          sub_once(
              r"(\s+\| 'quota_auto_paused'\n)",
              r"\1  | 'account_nil'\n  | 'excluded'\n  | 'custom_protocol_missing'\n  | 'protocol_incompatible'\n  | 'relay_mode_protocol_mismatch'\n  | 'protocol_conversion_unavailable'\n  | 'schedulable_disabled'\n  | 'privacy_required'\n  | 'channel_restricted'\n  | 'window_cost_exceeded'\n  | 'credentials_missing'\n"
          )

          sub_once(
              r"export interface ErrorAnalysisAccountReason \{\n\s+key: ErrorAnalysisAccountReasonKey\n\s+detail\?: string\n\}",
              """export interface ErrorAnalysisAccountReason {
            key: ErrorAnalysisAccountReasonKey
            detail?: string
            source?: 'request_time' | 'current_state'
          }"""
          )

          sub_once(
              r"export interface ErrorAnalysisAccountDiagnostic \{\n\s+account: Account\n\s+available: boolean\n\s+reasons: ErrorAnalysisAccountReason\[\]\n\}",
              """export interface ErrorAnalysisAccountDiagnostic {
            account: Account
            available: boolean
            reasons: ErrorAnalysisAccountReason[]
            source?: 'request_time' | 'current_state'
          }

          interface RecordedSchedulerAccountDiagnostic {
            account_id: number
            available: boolean
            reason?: ErrorAnalysisAccountReasonKey
            detail?: string
          }

          interface RecordedSchedulerDiagnostics {
            version: number
            inbound_protocol?: string
            requested_model?: string
            group_id?: number
            platform?: string
            reason_counts?: Record<string, number>
            accounts?: RecordedSchedulerAccountDiagnostic[]
          }"""
          )

          sub_once(
              r"(const NETWORK_RE = /[^\n]+/i\n)",
              r"\1const SCHEDULER_DIAGNOSTICS_RE = /scheduler_diagnostics=([A-Za-z0-9_-]+)/\n"
          )

          sub_once(
              r"function normalize\(value: unknown\): string \{\n\s+return String\(value \?\? ''\)\.trim\(\)\.toLowerCase\(\)\n\}",
              """function normalize(value: unknown): string {
            return String(value ?? '').trim().toLowerCase()
          }

          export function parseRecordedSchedulerDiagnostics(
            detail: OpsErrorDetail | OpsErrorLog | null | undefined
          ): RecordedSchedulerDiagnostics | null {
            const match = String(detail?.message || '').match(SCHEDULER_DIAGNOSTICS_RE)
            if (!match?.[1]) return null
            try {
              const normalized = match[1].replace(/-/g, '+').replace(/_/g, '/')
              const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4)
              const binary = atob(padded)
              const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0))
              return JSON.parse(new TextDecoder().decode(bytes)) as RecordedSchedulerDiagnostics
            } catch {
              return null
            }
          }"""
          )

          sub_once(
              r"case 'account_scheduler':\n(\s+)pushEvidence\(evidence, 'account',[\s\S]*?\n\1break",
              """case 'account_scheduler': {
                pushEvidence(evidence, 'account', detail.account_name || detail.account_id || 'none', detail.account_id ? 'neutral' : 'warning')
                pushEvidence(evidence, 'status', detail.status_code, detail.status_code >= 500 ? 'danger' : 'warning')
                if (hasNoAvailableAccount(detail)) pushEvidence(evidence, 'scheduler_result', 'No available accounts', 'danger')
                if (isCustomProviderContext(detail, upstreamErrors)) pushEvidence(evidence, 'provider_kind', 'custom', 'warning')
                const recorded = parseRecordedSchedulerDiagnostics(detail)
                if (recorded?.inbound_protocol) pushEvidence(evidence, 'inbound_protocol', recorded.inbound_protocol)
                if (recorded?.accounts) pushEvidence(evidence, 'evaluated_accounts', recorded.accounts.length)
                if (recorded?.reason_counts) {
                  const summary = Object.entries(recorded.reason_counts)
                    .sort((a, b) => b[1] - a[1])
                    .map(([reason, count]) => `${reason}:${count}`)
                    .join(', ')
                  pushEvidence(evidence, 'rejection_reasons', summary, 'danger')
                }
                break
              }"""
          )

          sub_once(
              r"(export function diagnoseSchedulerAccount\([\s\S]*?\): ErrorAnalysisAccountDiagnostic \{\n)(\s+const reasons: ErrorAnalysisAccountReason\[\] = \[\])",
              r"\1  const recorded = parseRecordedSchedulerDiagnostics(detail)\n  const recordedAccount = recorded?.accounts?.find((item) => item.account_id === account.id)\n  if (recordedAccount) {\n    const reasons: ErrorAnalysisAccountReason[] = []\n    if (!recordedAccount.available && recordedAccount.reason) {\n      reasons.push({ key: recordedAccount.reason, detail: recordedAccount.detail, source: 'request_time' })\n    }\n    return { account, available: recordedAccount.available, reasons, source: 'request_time' }\n  }\n\n\2"
          )

          sub_once(
              r"return \{\n\s+account,\n\s+available: reasons\.length === 0,\n\s+reasons\n\s+\}\n\}",
              """return {
            account,
            available: reasons.length === 0,
            reasons: reasons.map((reason) => ({ ...reason, source: 'current_state' })),
            source: 'current_state'
          }
          }"""
          )

          path.write_text(text)

          view = Path('frontend/src/views/admin/ops/ErrorAnalysisView.vue')
          text = view.read_text()
          text, count = re.subn(
              r"function accountReasonLabel\(reason: ErrorAnalysisAccountReason\): string \{\n\s+const translated = t\(`admin\.ops\.errorAnalysis\.schedulerAccounts\.reason\.\$\{reason\.key\}`\)\n\s+const base = translated !== `admin\.ops\.errorAnalysis\.schedulerAccounts\.reason\.\$\{reason\.key\}` \? translated : reason\.key\n\s+return reason\.detail \? `\$\{base\}: \$\{reason\.detail\}` : base\n\}",
              """function accountReasonLabel(reason: ErrorAnalysisAccountReason): string {
            const translated = t(`admin.ops.errorAnalysis.schedulerAccounts.reason.${reason.key}`)
            const base = translated !== `admin.ops.errorAnalysis.schedulerAccounts.reason.${reason.key}` ? translated : reason.key
            const source = reason.source === 'request_time' ? '[request-time]' : '[current-state]'
            return reason.detail ? `${source} ${base}: ${reason.detail}` : `${source} ${base}`
          }""",
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'accountReasonLabel patch count={count}')
          view.write_text(text)
          PY

      - name: Typecheck frontend
        shell: bash
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Commit UI patch
        shell: bash
        run: |
          git rm .github/workflows/apply-error-analysis-ui.yml
          git add frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(ops): show request-time account rejection reasons"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

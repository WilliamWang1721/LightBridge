name: Capture Router Full CI Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Capture unit tests
        shell: bash
        run: |
          set +e
          cd backend
          make test-unit > ../UNIT_TEST_OUTPUT.txt 2>&1
          status=$?
          echo "exit_status=$status" >> ../UNIT_TEST_OUTPUT.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: router-unit-output
          path: UNIT_TEST_OUTPUT.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Run lint and write output
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m --output.text.path=../LINT_OUTPUT.txt
          working-directory: backend
      - name: Record lint status
        shell: bash
        run: |
          echo "outcome=${{ steps.lint.outcome }}" >> LINT_OUTPUT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: router-lint-output
          path: LINT_OUTPUT.txt

name: UI full source snapshot

on:
  push:
    branches:
      - agent/ui-complete-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Package installed workspace
        run: |
          tar \
            --exclude='.git' \
            --exclude='backend/vendor' \
            -czf /tmp/lightbridge-ui-workspace.tar.gz .

      - name: Upload installed workspace
        uses: actions/upload-artifact@v4
        with:
          name: lightbridge-ui-workspace
          path: /tmp/lightbridge-ui-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

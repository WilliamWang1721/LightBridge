name: Repair v0.3.5 UI regressions r2

on:
  push:
    branches:
      - main
    paths:
      - '.github/repair-triggers/ui-regressions-v0.3.5-r2'

permissions:
  contents: write

concurrency:
  group: repair-ui-regressions-v0.3.5-r2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: fix/ui-regressions-v0.3.5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply UI fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          template_path = Path('frontend/src/components/account/templates/CreateAccountModal.template.html')
          template = template_path.read_text(encoding='utf-8')

          start_marker = '      <!-- Custom Provider Configuration -->\n'
          relay_marker = '      <!-- Custom relay mode -->\n'
          if template.count(start_marker) != 1 or template.count(relay_marker) != 1:
              raise SystemExit('custom provider section markers are missing or duplicated')

          opening = '''      <!-- Custom Provider Configuration -->
      <section
        v-if="form.platform === 'custom'"
        class="space-y-4 rounded-xl border border-gray-200 bg-gray-50/70 p-4 dark:border-dark-600 dark:bg-dark-800/40"
        data-testid="custom-connection-settings"
      >
        <div>
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white">
            {{ t('admin.accounts.custom.title') }}
          </h3>
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
            {{ t('admin.accounts.custom.presetHint') }}
          </p>
        </div>
'''
          template = template.replace(start_marker, opening, 1)
          template = template.replace(relay_marker, '      </section>\n\n' + relay_marker, 1)

          custom_key_pattern = re.compile(
              r'(<label class="input-label">)\{\{ t\(\'admin\.accounts\.apiKey\'\) \}\}(</label>\s*\n\s*<input\s*\n\s*v-model="form\.customApiKey")'
          )
          template, count = custom_key_pattern.subn(
              r"\1{{ t('admin.accounts.apiKeyRequired') }}\2",
              template,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'custom API key label replacement count={count}')

          generic_key_old = '''        <template v-else>
        <div>
          <label class="input-label">{{ t('admin.accounts.apiKeyRequired') }}</label>'''
          generic_key_new = '''        <template v-else-if="form.platform !== 'custom'">
        <div>
          <label class="input-label">{{ t('admin.accounts.apiKeyRequired') }}</label>'''
          if template.count(generic_key_old) != 1:
              raise SystemExit(f'generic API key block match count={template.count(generic_key_old)}')
          template = template.replace(generic_key_old, generic_key_new, 1)

          relay_old = '''      <div
        v-if="form.platform === 'custom'"
        class="border-t border-gray-200 pt-4 dark:border-dark-600"
      >'''
          relay_new = '''      <section
        v-if="form.platform === 'custom'"
        class="rounded-xl border border-gray-200 bg-white p-4 dark:border-dark-600 dark:bg-dark-800/30"
        data-testid="custom-routing-settings"
      >'''
          if template.count(relay_old) != 1:
              raise SystemExit(f'custom relay wrapper match count={template.count(relay_old)}')
          template = template.replace(relay_old, relay_new, 1)

          relay_end_old = '''        </div>
      </div>

      <!-- LightBridge Connect Configuration (for New API and compatible services) -->'''
          relay_end_new = '''        </div>
      </section>

      <!-- LightBridge Connect Configuration (for New API and compatible services) -->'''
          if template.count(relay_end_old) != 1:
              raise SystemExit(f'custom relay closing match count={template.count(relay_end_old)}')
          template = template.replace(relay_end_old, relay_end_new, 1)
          template_path.write_text(template, encoding='utf-8')

          replace_once(
              'frontend/src/components/account/ModelWhitelistSelector.vue',
              '        :disabled="isSyncingUpstream"\n        class="inline-flex min-h-9 items-center justify-center rounded-lg bg-primary-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60"',
              '        :disabled="isSyncingUpstream"\n        data-testid="sync-upstream-models-button"\n        class="inline-flex min-h-9 items-center justify-center rounded-lg border border-blue-700 bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-700 dark:border-blue-400 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-400 dark:disabled:border-dark-500 dark:disabled:bg-dark-600 dark:disabled:text-gray-300"',
          )

          replace_once(
              'frontend/src/components/common/UpgradeChangesDialog.vue',
              '          class="inline-flex items-center gap-2 rounded-lg bg-green-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-green-600 disabled:cursor-not-allowed disabled:opacity-50"',
              '          data-testid="restart-after-upgrade-button"\n          class="inline-flex min-w-32 items-center justify-center gap-2 rounded-lg border border-blue-700 bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-700 dark:border-blue-400 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-400 dark:disabled:border-dark-500 dark:disabled:bg-dark-600 dark:disabled:text-gray-300"',
          )

          replace_once(
              'frontend/src/components/common/VersionBadge.vue',
              '                  class="flex w-full items-center justify-center gap-2 rounded-lg bg-green-500 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-green-600 disabled:cursor-not-allowed disabled:opacity-50"',
              '                  data-testid="version-badge-restart-button"\n                  class="flex w-full items-center justify-center gap-2 rounded-lg border border-blue-700 bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:border-gray-300 disabled:bg-gray-300 disabled:text-gray-700 dark:border-blue-400 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-400 dark:disabled:border-dark-500 dark:disabled:bg-dark-600 dark:disabled:text-gray-300"',
          )

          Path('frontend/src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts').write_text('''import { readFileSync } from 'node:fs'
import { fileURLToPath } from 'node:url'
import { describe, expect, it } from 'vitest'

const template = readFileSync(
  fileURLToPath(new URL('../templates/CreateAccountModal.template.html', import.meta.url)),
  'utf-8'
)

describe('CreateAccountModal custom provider UI', () => {
  it('uses one required custom API key and hides the generic API key field for Custom', () => {
    expect(template).toContain("v-else-if=\"form.platform !== 'custom'\"")
    expect(template.match(/v-model=\"form\\.customApiKey\"/g)).toHaveLength(1)
    expect(template.match(/v-model=\"apiKeyValue\"/g)).toHaveLength(1)
    expect(template).toContain("{{ t('admin.accounts.apiKeyRequired') }}")
  })

  it('visually separates connection and routing settings', () => {
    expect(template).toContain('data-testid="custom-connection-settings"')
    expect(template).toContain('data-testid="custom-routing-settings"')
  })
})
''', encoding='utf-8')

          Path('frontend/src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts').write_text('''import { readFileSync } from 'node:fs'
import { fileURLToPath } from 'node:url'
import { describe, expect, it } from 'vitest'

const source = readFileSync(
  fileURLToPath(new URL('../ModelWhitelistSelector.vue', import.meta.url)),
  'utf-8'
)

describe('ModelWhitelistSelector action visibility', () => {
  it('keeps upstream sync legible in enabled and disabled states', () => {
    expect(source).toContain('data-testid="sync-upstream-models-button"')
    expect(source).toContain('bg-blue-600')
    expect(source).toContain('disabled:bg-gray-300')
    expect(source).toContain('disabled:text-gray-700')
  })
})
''', encoding='utf-8')

          dialog_test = Path('frontend/src/components/common/__tests__/UpgradeChangesDialog.spec.ts')
          dialog_text = dialog_test.read_text(encoding='utf-8')
          needle = "    expect(restartButton).toBeDefined()\n    expect(restartButton!.element.closest('.modal-footer')).not.toBeNull()"
          replacement = "    expect(restartButton).toBeDefined()\n    expect(restartButton!.attributes('data-testid')).toBe('restart-after-upgrade-button')\n    expect(restartButton!.classes()).toContain('bg-blue-600')\n    expect(restartButton!.classes()).toContain('disabled:text-gray-700')\n    expect(restartButton!.element.closest('.modal-footer')).not.toBeNull()"
          if dialog_text.count(needle) != 1:
              raise SystemExit(f'UpgradeChangesDialog test insertion count={dialog_text.count(needle)}')
          dialog_test.write_text(dialog_text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Format, test, type-check, and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec prettier --write \
            src/components/account/templates/CreateAccountModal.template.html \
            src/components/account/ModelWhitelistSelector.vue \
            src/components/common/UpgradeChangesDialog.vue \
            src/components/common/VersionBadge.vue \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts
          pnpm --dir frontend exec vitest run \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts \
            src/components/common/__tests__/VersionBadge.spec.ts
          pnpm --dir frontend run type-check
          pnpm --dir frontend run build
          git diff --check

      - name: Commit and push repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/components/account/templates/CreateAccountModal.template.html \
            frontend/src/components/account/ModelWhitelistSelector.vue \
            frontend/src/components/common/UpgradeChangesDialog.vue \
            frontend/src/components/common/VersionBadge.vue \
            frontend/src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            frontend/src/components/account/__tests__/ModelWhitelistSelector.visibility.spec.ts \
            frontend/src/components/common/__tests__/UpgradeChangesDialog.spec.ts
          git commit -m 'fix(ui): repair custom account form and action visibility'
          git push origin "HEAD:${TARGET_BRANCH}"

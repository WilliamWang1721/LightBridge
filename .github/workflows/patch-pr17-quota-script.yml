name: Patch PR17 Quota Script

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/universal-router-diagnostics-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch compact quota fixture logic
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('tools/fix_pr17_checks.py')
          text = path.read_text()
          start = text.index('    quota_pattern = re.compile(')
          end = text.index('\n    write(path, text)', start)
          replacement = '''    quota_old = (\n        '\"default_platform_quotas\": {\"anthropic\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"antigravity\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"gemini\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"openai\":{\"daily\":null,\"weekly\":null,\"monthly\":null}},'\n    )\n    quota_new = (\n        '\"default_platform_quotas\": {\"anthropic\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"antigravity\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"custom\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"gemini\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"grok\":{\"daily\":null,\"weekly\":null,\"monthly\":null},'\n        '\"openai\":{\"daily\":null,\"weekly\":null,\"monthly\":null}},'\n    )\n    if quota_old in text:\n        text = text.replace(quota_old, quota_new)\n    elif '\"custom\":{\"daily\":null,\"weekly\":null,\"monthly\":null}' not in text or '\"grok\":{\"daily\":null,\"weekly\":null,\"monthly\":null}' not in text:\n        raise RuntimeError('compact default_platform_quotas fixtures not found')\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python -m py_compile tools/fix_pr17_checks.py
          git config user.name 'openai-ci-fixer'
          git config user.email 'openai-ci-fixer@users.noreply.github.com'
          git add tools/fix_pr17_checks.py
          git commit -m 'chore(ci): handle compact quota contract fixtures'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

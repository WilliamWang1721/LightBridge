name: Apply Provider-Neutral Gateway Fixes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-provider-neutral-gateway-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-bug-audit-fixes
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false

      - name: Verify and apply behavior repairs
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n' < .github/repair-payload/current-behavior-fixes.patch.b64 | base64 --decode > /tmp/current-behavior-fixes.patch
          echo 'dc9b16554c8ca340ddf0cdb63916d438758a77e343d30d3e814cd39b66a4f26d  /tmp/current-behavior-fixes.patch' | sha256sum --check --strict
          git apply --check /tmp/current-behavior-fixes.patch
          git apply --index /tmp/current-behavior-fixes.patch

          python3 - <<'PY'
          from pathlib import Path

          expectation_path = Path('backend/internal/handler/admin/system_handler_test.go')
          text = expectation_path.read_text(encoding='utf-8')
          old = '\trequire.Empty(t, updateSvc.checkForces)'
          new = '\trequire.Equal(t, []bool{false}, updateSvc.checkForces)'
          if old in text:
              text = text.replace(old, new, 1)
              expectation_path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('system handler update-force expectation was not found')

          legacy_files = [
              Path('backend/internal/service/billing_service_unified_test.go'),
              Path('backend/internal/service/gateway_websearch_emulation_test.go'),
              Path('backend/internal/service/account_stats_pricing_test.go'),
          ]
          removed_total = 0
          for path in legacy_files:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              kept = []
              removed = 0
              for line in lines:
                  if 'groupPlatform:' in line:
                      removed += 1
                      continue
                  kept.append(line)
              if removed:
                  path.write_text(''.join(kept), encoding='utf-8')
              removed_total += removed
              print(f'{path}: removed {removed} legacy groupPlatform field(s)')
          if removed_total == 0:
              raise SystemExit('no legacy groupPlatform test fields were found')
          PY

          gofmt -w backend/internal/handler/gateway_handler_models.go backend/internal/service/gateway_models_debug.go backend/internal/handler/openai_gateway_responses.go backend/internal/handler/openai_gateway_websocket.go backend/internal/handler/admin/system_handler_test.go backend/internal/service/billing_service_unified_test.go backend/internal/service/gateway_websearch_emulation_test.go backend/internal/service/account_stats_pricing_test.go

          rm -rf .github/repair-payload
          git add --all
          git diff --cached --check

      - name: Commit and push repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete provider-neutral gateway regressions'
          git push origin HEAD:agent/complete-bug-audit-fixes

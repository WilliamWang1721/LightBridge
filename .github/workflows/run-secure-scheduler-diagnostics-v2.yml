name: Run Scheduler Diagnostics Security Patch V2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  secure:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run corrected security patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/secure-scheduler-diagnostics.yml').read_text()
          start_marker = "      - name: Separate internal diagnostics from client errors\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Test changed backend packages\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          lines = src[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))'''
          new_helper = '''def replace_once(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} match(es), got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, expected))'''
          if old_helper not in script:
              raise SystemExit('replace_once helper not found')
          script = script.replace(old_helper, new_helper, 1)

          old_loop = '''for path, (old, new) in handler_patches.items():
              replace_once(path, old, new)'''
          new_loop = '''for path, (old, new) in handler_patches.items():
              expected = 2 if path == 'backend/internal/handler/gateway_handler.go' else 1
              replace_once(path, old, new, expected)'''
          if old_loop not in script:
              raise SystemExit('handler patch loop not found')
          script = script.replace(old_loop, new_loop, 1)

          Path('/tmp/secure-scheduler-diagnostics-v2.sh').write_text(script)
          PY
          bash /tmp/secure-scheduler-diagnostics-v2.sh

      - name: Test changed backend packages
        shell: bash
        run: |
          cd backend
          go test ./internal/service ./internal/handler

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Commit secured diagnostics
        shell: bash
        run: |
          git rm \
            .github/workflows/secure-scheduler-diagnostics.yml \
            .github/workflows/capture-secure-scheduler-patch.yml \
            .github/workflows/run-secure-scheduler-diagnostics-v2.yml
          git add backend frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: keep scheduler diagnostics internal to ops"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Publish final UI fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/repair-triggers/publish-final-ui-fix'

permissions:
  contents: write

concurrency:
  group: publish-final-ui-fix
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: fix/ui-regressions-v0.3.5-clean
      TARGET_BRANCH: fix/ui-regressions-v0.3.5-final
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Copy validated UI files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${SOURCE_BRANCH}"
          git checkout "origin/${SOURCE_BRANCH}" -- \
            frontend/src/components/account/ModelWhitelistSelector.vue \
            frontend/src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            frontend/src/components/account/__tests__/ModelWhitelistSelector.layout.spec.ts \
            frontend/src/components/account/templates/CreateAccountModal.template.html \
            frontend/src/components/common/UpgradeChangesDialog.vue \
            frontend/src/components/common/__tests__/UpgradeChangesDialog.spec.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate final branch
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec vitest run \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.layout.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts \
            src/components/common/__tests__/VersionBadge.spec.ts
          pnpm --dir frontend exec eslint \
            src/components/account/CreateAccountModal.vue \
            src/components/account/ModelWhitelistSelector.vue \
            src/components/common/UpgradeChangesDialog.vue \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.layout.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts
          pnpm --dir frontend run typecheck
          pnpm --dir frontend run build
          python3 tools/codebase_inventory.py
          python3 tools/codebase_inventory.py --check
          git diff --check

      - name: Commit final UI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/src/components/account/ModelWhitelistSelector.vue \
            frontend/src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            frontend/src/components/account/__tests__/ModelWhitelistSelector.layout.spec.ts \
            frontend/src/components/account/templates/CreateAccountModal.template.html \
            frontend/src/components/common/UpgradeChangesDialog.vue \
            frontend/src/components/common/__tests__/UpgradeChangesDialog.spec.ts \
            docs/architecture/CODEBASE_INVENTORY.tsv
          git commit -m 'fix(ui): normalize Custom account actions'
          git push origin "HEAD:${TARGET_BRANCH}"

name: Apply verified UI migration batch

on:
  push:
    branches:
      - agent/ui-complete-migration

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat(ui): apply full-site semantic bridge and chart theming'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: agent/ui-complete-migration
          fetch-depth: 0

      - name: Restore verified local batch
        env:
          UI_BATCH_B64: 
        run: |
          printf '%s' "$UI_BATCH_B64" | base64 --decode > /tmp/ui-local-batch.tar.gz
          tar -xzf /tmp/ui-local-batch.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate batch
        run: |
          python3 tools/ui_migration_audit.py
          pnpm --dir frontend run lint:check
          pnpm --dir frontend run typecheck
          make test-frontend-critical
          pnpm --dir frontend run build

      - name: Commit verified batch
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile tools/ui_migration_audit.py frontend/src/main.ts frontend/src/styles/ui-modern-compat.css frontend/src/styles/ui-modern-tailwind-bridge.css frontend/src/components/ui/input/Input.vue frontend/src/components/ui/textarea/Textarea.vue frontend/src/ui-platform/chartTheme.ts frontend/src/ui-platform/chartTheme.test.ts
          git commit -m 'feat(ui): apply full-site semantic bridge and chart theming'
          git push origin HEAD:agent/ui-complete-migration

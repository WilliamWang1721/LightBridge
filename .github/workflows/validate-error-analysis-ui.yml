name: Validate Scheduler Diagnostics UI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run frontend typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm typecheck > /tmp/typecheck.log 2>&1

      - name: Persist validation result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.typecheck.outcome }}" = "success" ]; then
            git rm .github/workflows/validate-error-analysis-ui.yml
            rm -f TYPECHECK_FAILURE.txt
            git add -A
            git commit -m "test: verify scheduler diagnostics UI typecheck"
          else
            cp /tmp/typecheck.log TYPECHECK_FAILURE.txt
            git add TYPECHECK_FAILURE.txt
            git commit -m "test: capture scheduler diagnostics UI typecheck failure"
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

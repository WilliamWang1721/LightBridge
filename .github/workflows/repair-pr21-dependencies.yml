name: Repair PR21 Dependencies

on:
  push:
    branches:
      - agent/complete-bug-audit-fixes

permissions:
  contents: read

jobs:
  repair-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
      - name: Upgrade vulnerable Go modules
        working-directory: backend
        run: |
          go get google.golang.org/grpc@v1.82.1
          go get golang.org/x/text@v0.39.0
          go mod tidy
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Upgrade vulnerable frontend modules
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm update postcss@latest
      - name: Collect repaired dependency files
        run: |
          mkdir repaired-dependencies
          cp backend/go.mod backend/go.sum repaired-dependencies/
          cp frontend/package.json frontend/pnpm-lock.yaml repaired-dependencies/
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-dependencies
          path: repaired-dependencies
          retention-days: 1

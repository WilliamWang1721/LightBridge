name: Repair provider-neutral integration tests

on:
  push:
    branches:
      - agent/complete-bug-audit-fixes
    paths:
      - .github/workflows/repair-provider-neutral-integration-tests.yml

permissions:
  contents: write

concurrency:
  group: repair-provider-neutral-integration-tests
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-bug-audit-fixes
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Apply provider-neutral integration test repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          group_test = Path('backend/internal/repository/group_repo_integration_test.go')
          text = group_test.read_text(encoding='utf-8')
          replacements = [
              (
                  'func (s *GroupRepoSuite) TestListWithFilters_Platform() {',
                  'func (s *GroupRepoSuite) TestListWithFilters_UpstreamProtocol() {',
              ),
              (
                  'pagination.PaginationParams{Page: 1, PageSize: 10},\n\t\tservice.PlatformOpenAI,',
                  'pagination.PaginationParams{Page: 1, PageSize: 10},\n\t\tservice.CustomProtocolOpenAIResponses,',
              ),
              (
                  'pagination.PaginationParams{Page: 1, PageSize: 10}, service.PlatformOpenAI, "", "", nil)',
                  'pagination.PaginationParams{Page: 1, PageSize: 10}, service.CustomProtocolOpenAIResponses, "", "", nil)',
              ),
              (
                  'pagination.PaginationParams{Page: 1, PageSize: 10}, service.PlatformAnthropic, service.StatusActive, "", &isExclusive)',
                  'pagination.PaginationParams{Page: 1, PageSize: 10}, service.CustomProtocolAnthropicMessages, service.StatusActive, "", &isExclusive)',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected integration-test text: {old!r}')
              text = text.replace(old, new, 1)

          multiline_old = '\t\tservice.PlatformAnthropic, service.StatusActive, "", &isExclusive)'
          multiline_new = '\t\tservice.CustomProtocolAnthropicMessages, service.StatusActive, "", &isExclusive)'
          if text.count(multiline_old) != 2:
              raise SystemExit(f'expected 2 multiline legacy filters, found {text.count(multiline_old)}')
          text = text.replace(multiline_old, multiline_new)
          group_test.write_text(text, encoding='utf-8')

          sort_test = Path('backend/internal/repository/group_repo_sort_integration_test.go')
          text = sort_test.read_text(encoding='utf-8')
          old = '}, service.PlatformAnthropic, service.StatusActive, "", nil)'
          new = '}, service.CustomProtocolAnthropicMessages, service.StatusActive, "", nil)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one sort legacy filter, found {text.count(old)}')
          sort_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          simple_test = Path('backend/internal/repository/simple_mode_default_groups_integration_test.go')
          text = simple_test.read_text(encoding='utf-8')
          old = '''\t// Create and then soft-delete the neutral default group.\n\tg, err := client.Group.Create().\n\t\tSetName("default").\n\t\tSetStatus("active").\n\t\tSetSubscriptionType("standard").\n\t\tSetRateMultiplier(1.0).\n\t\tSetIsExclusive(false).\n\t\tSave(seedCtx)\n\trequire.NoError(t, err)\n'''
          new = '''\t// Migration 008 seeds the neutral default group. Soft-delete that row so\n\t// this test verifies recreation instead of colliding with the seed data.\n\tg, err := client.Group.Query().\n\t\tWhere(group.NameEQ("default"), group.DeletedAtIsNil()).\n\t\tOnly(seedCtx)\n\trequire.NoError(t, err)\n'''
          if old not in text:
              raise SystemExit('expected seeded default-group test block not found')
          simple_test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          gofmt -w \
            backend/internal/repository/group_repo_integration_test.go \
            backend/internal/repository/group_repo_sort_integration_test.go \
            backend/internal/repository/simple_mode_default_groups_integration_test.go

          git diff --check

      - name: Run repository integration tests
        working-directory: backend
        run: go test -tags=integration ./internal/repository

      - name: Commit verified repairs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-provider-neutral-integration-tests.yml
          git add \
            backend/internal/repository/group_repo_integration_test.go \
            backend/internal/repository/group_repo_sort_integration_test.go \
            backend/internal/repository/simple_mode_default_groups_integration_test.go \
            .github/workflows/repair-provider-neutral-integration-tests.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align repository integration fixtures with provider-neutral groups'
          git push origin HEAD:agent/complete-bug-audit-fixes

name: Bootstrap distribution from main

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: bootstrap-distribution-main
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/content-distribution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/content-distribution
          fetch-depth: 0

      - name: Apply distribution wiring
        run: python3 scripts/apply_distribution_wiring.py

      - name: Format Go files
        run: |
          gofmt -w \
            backend/internal/service/wire.go \
            backend/internal/handler/handler.go \
            backend/internal/handler/wire.go \
            backend/internal/server/routes/admin.go \
            backend/internal/server/routes/user.go

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate Wire dependency graph
        working-directory: backend
        run: go generate ./cmd/server

      - name: Commit wired implementation
        run: |
          rm -f .github/workflows/agent-content-distribution.yml
          rm -f .github/workflows/agent-content-distribution-apply.yml
          rm -f scripts/apply_distribution_wiring.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(distribution): wire content distribution center"
          git push origin HEAD:agent/content-distribution

name: Repair emergency workflow matcher

on:
  push:
    branches: [agent/emergency-v0.3.61]
    paths: [.github/workflows/emergency-v0361-workflow-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/emergency-v0.3.61
      - name: Narrow createBackup matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/emergency-v0361-review.yml')
          s=p.read_text()
          old="""          sub(p, ') (*BackupRecord, error) {\\n\\tif s.shuttingDown.Load() {\\n\\t\\treturn nil, infraerrors.ServiceUnavailable(\"SERVER_SHUTTING_DOWN\", \"server is shutting down\")\\n\\t}\\n\\n\\ts.opMu.Lock()',
                 ') (*BackupRecord, error) {\\n\\tfinish, err := s.beginTrackedOperation()\\n\\tif err != nil { return nil, err }\\n\\tdefer finish()\\n\\n\\ts.opMu.Lock()', count=1)
"""
          new="""          sub(p, '''func (s *BackupService) createBackup(
\\tctx context.Context,
\\ttriggeredBy string,
\\texpireDays int,
\\tmetadata *BackupRecordMetadata,
) (*BackupRecord, error) {
\\tif s.shuttingDown.Load() {
\\t\\treturn nil, infraerrors.ServiceUnavailable(\"SERVER_SHUTTING_DOWN\", \"server is shutting down\")
\\t}

\\ts.opMu.Lock()''',
                 '''func (s *BackupService) createBackup(
\\tctx context.Context,
\\ttriggeredBy string,
\\texpireDays int,
\\tmetadata *BackupRecordMetadata,
) (*BackupRecord, error) {
\\tfinish, err := s.beginTrackedOperation()
\\tif err != nil { return nil, err }
\\tdefer finish()

\\ts.opMu.Lock()''')
"""
          if s.count(old) != 1:
              raise SystemExit(f'matcher block count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/emergency-v0361-review.yml
          git commit -m 'ci: narrow createBackup repair matcher'
          git push origin HEAD:agent/emergency-v0.3.61

name: Debug PR17 Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Capture unit test output
        shell: bash
        run: |
          set +e
          cd backend
          make test-unit > ../unit.log 2>&1
          status=$?
          echo "$status" > ../unit.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr17-unit
          path: |
            unit.log
            unit.status

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Capture golangci-lint output
        shell: bash
        run: |
          set +e
          cd backend
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0 run --timeout=30m > ../lint.log 2>&1
          status=$?
          echo "$status" > ../lint.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr17-lint
          path: |
            lint.log
            lint.status

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Capture govulncheck output
        shell: bash
        run: |
          set +e
          cd backend
          go install golang.org/x/vuln/cmd/govulncheck@latest > ../govuln-install.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            govulncheck ./... > ../govuln.log 2>&1
            status=$?
          else
            status=$install_status
            : > ../govuln.log
          fi
          echo "$status" > ../govuln.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr17-govuln
          path: |
            govuln-install.log
            govuln.log
            govuln.status

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Capture audit exception output
        shell: bash
        run: |
          set +e
          cd frontend
          pnpm install --frozen-lockfile > ../pnpm-install.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            pnpm audit --prod --audit-level=high --json > audit.json 2> ../pnpm-audit.stderr
            python ../tools/check_pnpm_audit_exceptions.py --audit audit.json --exceptions ../.github/audit-exceptions.yml > ../audit-check.log 2>&1
            status=$?
          else
            status=$install_status
            : > audit.json
            : > ../pnpm-audit.stderr
            : > ../audit-check.log
          fi
          echo "$status" > ../audit.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr17-audit
          path: |
            frontend/audit.json
            pnpm-install.log
            pnpm-audit.stderr
            audit-check.log
            audit.status

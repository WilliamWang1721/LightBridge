name: Apply Unit Test Repairs

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-unit-test-repairs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-bug-audit-fixes
          fetch-depth: 1
          persist-credentials: true
      - name: Verify and apply unit-test repairs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/unit-fixes.patch.b64 <<'PATCH'
          
          PATCH
          sed 's/^[[:space:]]*//' /tmp/unit-fixes.patch.b64 | base64 --decode > /tmp/unit-fixes.patch
          echo 'ff895853f483bc210257a50a50f7207d313730d1275878e22f8ba56eb4d31465  /tmp/unit-fixes.patch' | sha256sum --check --strict
          git apply --check /tmp/unit-fixes.patch
          git apply --index /tmp/unit-fixes.patch
          git diff --cached --check
      - name: Commit and push repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce database-safe version actions'
          git push origin HEAD:agent/complete-bug-audit-fixes

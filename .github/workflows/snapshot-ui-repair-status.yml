name: Snapshot UI repair status

on:
  push:
    branches:
      - main
    paths:
      - '.github/repair-triggers/ui-repair-status'

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Capture latest repair workflow state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/repair-status
          run_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/repair-ui-regressions-v0.3.5-r2.yml/runs?per_page=5" \
            --jq '.workflow_runs[0] // {}')"

          if [ "$(jq -r 'has("id")' <<<"$run_json")" != 'true' ]; then
            echo 'status=no_matching_run' > .github/repair-status/ui-regressions-v0.3.5-r2.txt
          else
            {
              jq -r '"run_id=" + (.id|tostring), "workflow=" + .name, "event=" + .event, "status=" + .status, "conclusion=" + (.conclusion // ""), "url=" + .html_url, "head_sha=" + .head_sha, "created_at=" + .created_at, "updated_at=" + .updated_at' <<<"$run_json"
            } > .github/repair-status/ui-regressions-v0.3.5-r2.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/repair-status/ui-regressions-v0.3.5-r2.txt
          git commit -m 'chore: snapshot UI repair status [skip ci]'
          git push origin HEAD:main

name: Normalize advanced filter UI formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/advanced-user-filter
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Normalize template indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/views/admin/UsersView.vue')
          text = path.read_text()
          old = '''            <!-- Activity Filter (visible when enabled) -->
            <div v-if="visibleFilters.has('activity')" class="w-full sm:w-52">
              <Select
                v-model="filters.activity"
                :options="[
                  { value: '', label: t('admin.users.allActivity') },
                  { value: 'any', label: t('admin.users.activityAny') },
                  { value: 'usage', label: t('admin.users.activityUsage') },
                  { value: 'balance_change', label: t('admin.users.activityBalanceChange') },
                  { value: 'none', label: t('admin.users.activityNone') }
                ]"
                @change="applyFilter"
              />
            </div>

            <!-- Group Filter (visible when enabled) -->
          '''
          # The previous automation preserved semantic whitespace but not the
          # surrounding template indentation. Match that exact rendered block.
          current = '''            <!-- Activity Filter (visible when enabled) -->
  <div v-if="visibleFilters.has('activity')" class="w-full sm:w-52">
    <Select
      v-model="filters.activity"
      :options="[
        { value: '', label: t('admin.users.allActivity') },
        { value: 'any', label: t('admin.users.activityAny') },
        { value: 'usage', label: t('admin.users.activityUsage') },
        { value: 'balance_change', label: t('admin.users.activityBalanceChange') },
        { value: 'none', label: t('admin.users.activityNone') }
      ]"
      @change="applyFilter"
    />
  </div>

  <!-- Group Filter (visible when enabled) -->
          '''
          if text.count(current) != 1:
              raise SystemExit('activity filter template block did not match exactly once')
          path.write_text(text.replace(current, old, 1))
          PY

      - name: Install and typecheck
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/agent-advanced-user-filter-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(admin): align activity filter markup"
          git push origin HEAD:agent/advanced-user-filter

name: Apply v0.3.5 UI repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/repair-triggers/apply-ui-regressions-v035'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/ui-regressions-v0.3.5
          fetch-depth: 0

      - name: Apply Custom form repair
        run: python3 .github/scripts/apply-ui-regressions-v035.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Validate frontend repair
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec vitest run \
            src/components/account/__tests__/CreateAccountModal.custom-ui.spec.ts \
            src/components/account/__tests__/ModelWhitelistSelector.layout.spec.ts \
            src/components/common/__tests__/UpgradeChangesDialog.spec.ts \
            src/components/common/__tests__/VersionBadge.spec.ts
          pnpm --dir frontend run lint
          pnpm --dir frontend run type-check
          pnpm --dir frontend run build
          git diff --check

      - name: Commit validated repair
        run: |
          rm -f .github/scripts/apply-ui-regressions-v035.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): repair custom account form regressions'
          git push origin HEAD:fix/ui-regressions-v0.3.5

name: Patch PR17 Central Script

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/universal-router-diagnostics-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct contract locator
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('tools/fix_pr17_checks.py')
          text = path.read_text()
          start = text.index('    group_pattern = re.compile(')
          end = text.index('\n    if \'"peak_rate_enabled": false\' not in text:', start)
          replacement = '''    group_pattern = re.compile(\n        r'(?m)^([ \\t]*)"name": "Group One",\\n([ \\t]*)"description": "desc",\\n([ \\t]*)"platform": "anthropic",'\n    )\n\n    def expand_group(match: re.Match[str]) -> str:\n        first_indent, description_indent, indent = match.groups()\n        return (\n            f'{first_indent}"name": "Group One",\\n'\n            f'{description_indent}"description": "desc",\\n'\n            f'{indent}"peak_end": "",\\n'\n            f'{indent}"peak_rate_enabled": false,\\n'\n            f'{indent}"peak_rate_multiplier": 0,\\n'\n            f'{indent}"peak_start": "",\\n'\n            f'{indent}"platform": "anthropic",'\n        )\n'''
          text = text[:start] + replacement + text[end:]
          old = '''    group_start = text.index('"name": "Group One"')\n    group_end = text.index("}`", group_start) if "}`" in text[group_start:] else len(text)\n    group_fragment = text[group_start:group_end]\n    if '"upstream_protocols": null' not in group_fragment:\n        weekly_pos = text.index('"weekly_limit_usd": null', group_start)\n        line_start = text.rfind("\\n", group_start, weekly_pos) + 1\n        indent = text[line_start:weekly_pos]\n        text = text[:line_start] + indent + '"upstream_protocols": null,\\n' + text[line_start:]\n'''
          new = '''    group_start = text.index('"name": "Group One"')\n    group_end = text.index("\\n\\t\\t\\t\\t\\t}", group_start)\n    group_fragment = text[group_start:group_end]\n    if '"upstream_protocols": null' not in group_fragment:\n        updated_pos = text.index('"updated_at": "2025-01-02T03:04:05Z"', group_start, group_end)\n        line_end = text.index("\\n", updated_pos)\n        line_start = text.rfind("\\n", group_start, updated_pos) + 1\n        indent = text[line_start:updated_pos]\n        text = text[:line_end] + ',\\n' + indent + '"upstream_protocols": null' + text[line_end:]\n'''
          if old not in text:
              raise SystemExit('old group insertion block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m py_compile tools/fix_pr17_checks.py
          git config user.name 'openai-ci-fixer'
          git config user.email 'openai-ci-fixer@users.noreply.github.com'
          git add tools/fix_pr17_checks.py
          git commit -m 'chore(ci): correct contract fixture locator'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

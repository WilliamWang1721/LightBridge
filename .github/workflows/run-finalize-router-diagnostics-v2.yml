name: Run Corrected Router Diagnostics Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run corrected patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/finalize-router-diagnostics-v2.yml').read_text()
          start_marker = "      - name: Complete load-aware diagnostics and polish UI\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Test backend service\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          lines = src[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          script = script.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)

          old = """malformed = '''  return {
          account,
          available: reasons.length === 0,
          reasons: reasons.map((reason) => ({ ...reason, source: 'current_state' })),
          source: 'current_state'
          }
          }
          '''
          if malformed not in text:
              raise SystemExit('unable to locate scheduler diagnostic return block')
          normalized = '''  return {
            account,
            available: reasons.length === 0,
            reasons: reasons.map((reason) => ({ ...reason, source: 'current_state' })),
            source: 'current_state'
          }
          }
          '''
          util.write_text(text.replace(malformed, normalized, 1))"""

          new = """normalized = '''  return {
            account,
            available: reasons.length === 0,
            reasons: reasons.map((reason) => ({ ...reason, source: 'current_state' })),
            source: 'current_state'
          }
          }
          '''
          text, count = re.subn(
              r\"  return \\\{\\n\\s*account,\\n\\s*available: reasons\\.length === 0,\\n\\s*reasons: reasons\\.map\\(\\(reason\\) => \\\{ \\.\\.\\.reason, source: 'current_state' \\\}\\)\\),\\n\\s*source: 'current_state'\\n\\s*\\}\\n\\}\",
              normalized,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'unable to normalize scheduler diagnostic return block: {count}')
          util.write_text(text)"""

          if old not in script:
              raise SystemExit('unable to patch embedded util normalizer')
          script = script.replace(old, new, 1)
          Path('/tmp/finalize-router-diagnostics.py.sh').write_text(script)
          PY
          bash /tmp/finalize-router-diagnostics.py.sh

      - name: Test backend service
        working-directory: backend
        run: go test ./internal/service

      - name: Typecheck frontend
        shell: bash
        run: |
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm typecheck

      - name: Commit finalized changes
        shell: bash
        run: |
          git rm .github/workflows/finalize-router-diagnostics-v2.yml .github/workflows/run-finalize-router-diagnostics-v2.yml
          rm -f PHASE1_TEST_FAILURE.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: cover load-aware scheduler rejection paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

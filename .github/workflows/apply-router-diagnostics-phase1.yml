name: Apply Router Diagnostics Phase One

on:
  push:
    branches:
      - fix/universal-router-diagnostics-phase1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/universal-router-diagnostics-phase1
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply phase-one patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, got {count}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path: str, pattern: str, replacement: str, flags=0) -> None:
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, got {count}: {pattern[:80]}")
              p.write_text(updated)

          replace_once(
              'backend/internal/service/account.go',
              '''func (a *Account) CustomProtocol() string {
          \tif !a.IsCustom() {
          \t\treturn ""
          \t}
          \treturn strings.TrimSpace(a.GetExtraString("protocol"))
          }
          ''',
              '''func (a *Account) CustomProtocol() string {
          \tif !a.IsCustom() {
          \t\treturn ""
          \t}
          \tif protocol := strings.TrimSpace(a.GetExtraString("protocol")); protocol != "" {
          \t\treturn protocol
          \t}
          \t// Compatibility for accounts created by older Custom forms that stored the
          \t// protocol beside credentials. New writes and the migration keep extra.protocol
          \t// as the single authoritative field; this fallback prevents an upgrade window
          \t// from making an otherwise healthy upstream invisible to the router.
          \treturn strings.TrimSpace(a.GetCredential("protocol"))
          }
          ''')

          gateway = Path('backend/internal/service/gateway_service.go')
          text = gateway.read_text()
          text = text.replace(
              '''type selectionFailureStats struct {
          \tTotal              int
          \tEligible           int
          \tExcluded           int
          \tUnschedulable      int
          \tModelUnsupported   int
          \tModelRateLimited   int
          \tSampleMappingIDs   []int64
          \tSampleRateLimitIDs []string
          }
          ''',
              '''type selectionFailureStats struct {
          \tTotal              int
          \tEligible           int
          \tExcluded           int
          \tUnschedulable      int
          \tModelUnsupported   int
          \tModelRateLimited   int
          \tSampleMappingIDs   []int64
          \tSampleRateLimitIDs []string
          \tDiagnostics        string
          }
          ''', 1)
          needle = '''\tstats := s.collectSelectionFailureStats(ctx, accounts, requestedModel, platform, excludedIDs, allowMixedScheduling)
          \tlogger.LegacyPrintf(
          '''
          if text.count(needle) != 1:
              raise SystemExit(f'gateway stats insertion expected one match, got {text.count(needle)}')
          text = text.replace(needle, '''\tstats := s.collectSelectionFailureStats(ctx, accounts, requestedModel, platform, excludedIDs, allowMixedScheduling)
          \tstats.Diagnostics = s.encodeSchedulerSelectionDiagnostics(ctx, groupID, accounts, requestedModel, platform, excludedIDs)
          \tlogger.LegacyPrintf(
          ''', 1)
          old_summary = '''func summarizeSelectionFailureStats(stats selectionFailureStats) string {
          \treturn fmt.Sprintf(
          \t\t"total=%d eligible=%d excluded=%d unschedulable=%d model_unsupported=%d model_rate_limited=%d",
          \t\tstats.Total,
          \t\tstats.Eligible,
          \t\tstats.Excluded,
          \t\tstats.Unschedulable,
          \t\tstats.ModelUnsupported,
          \t\tstats.ModelRateLimited,
          \t)
          }
          '''
          new_summary = '''func summarizeSelectionFailureStats(stats selectionFailureStats) string {
          \tsummary := fmt.Sprintf(
          \t\t"total=%d eligible=%d excluded=%d unschedulable=%d model_unsupported=%d model_rate_limited=%d",
          \t\tstats.Total,
          \t\tstats.Eligible,
          \t\tstats.Excluded,
          \t\tstats.Unschedulable,
          \t\tstats.ModelUnsupported,
          \t\tstats.ModelRateLimited,
          \t)
          \treturn appendSchedulerDiagnostics(summary, stats.Diagnostics)
          }
          '''
          if text.count(old_summary) != 1:
              raise SystemExit(f'gateway summary expected one match, got {text.count(old_summary)}')
          text = text.replace(old_summary, new_summary, 1)

          # Preserve diagnostics even when the request omitted a model.
          old_failure = '''\tif selected == nil {
          \t\tstats := s.logDetailedSelectionFailure(ctx, groupID, sessionHash, requestedModel, platform, accounts, excludedIDs, false)
          \t\tif requestedModel != "" {
          \t\t\treturn nil, fmt.Errorf("%w supporting model: %s (%s)", ErrNoAvailableAccounts, requestedModel, summarizeSelectionFailureStats(stats))
          \t\t}
          \t\treturn nil, ErrNoAvailableAccounts
          \t}
          '''
          new_failure = '''\tif selected == nil {
          \t\tstats := s.logDetailedSelectionFailure(ctx, groupID, sessionHash, requestedModel, platform, accounts, excludedIDs, false)
          \t\tif requestedModel != "" {
          \t\t\treturn nil, fmt.Errorf("%w supporting model: %s (%s)", ErrNoAvailableAccounts, requestedModel, summarizeSelectionFailureStats(stats))
          \t\t}
          \t\treturn nil, fmt.Errorf("%w (%s)", ErrNoAvailableAccounts, summarizeSelectionFailureStats(stats))
          \t}
          '''
          if text.count(old_failure) != 1:
              raise SystemExit(f'gateway single failure block expected one match, got {text.count(old_failure)}')
          text = text.replace(old_failure, new_failure, 1)

          old_mixed_failure = '''\tif selected == nil {
          \t\tstats := s.logDetailedSelectionFailure(ctx, groupID, sessionHash, requestedModel, nativePlatform, accounts, excludedIDs, true)
          \t\tif requestedModel != "" {
          \t\t\treturn nil, fmt.Errorf("%w supporting model: %s (%s)", ErrNoAvailableAccounts, requestedModel, summarizeSelectionFailureStats(stats))
          \t\t}
          \t\treturn nil, ErrNoAvailableAccounts
          \t}
          '''
          new_mixed_failure = '''\tif selected == nil {
          \t\tstats := s.logDetailedSelectionFailure(ctx, groupID, sessionHash, requestedModel, nativePlatform, accounts, excludedIDs, true)
          \t\tif requestedModel != "" {
          \t\t\treturn nil, fmt.Errorf("%w supporting model: %s (%s)", ErrNoAvailableAccounts, requestedModel, summarizeSelectionFailureStats(stats))
          \t\t}
          \t\treturn nil, fmt.Errorf("%w (%s)", ErrNoAvailableAccounts, summarizeSelectionFailureStats(stats))
          \t}
          '''
          if text.count(old_mixed_failure) != 1:
              raise SystemExit(f'gateway mixed failure block expected one match, got {text.count(old_mixed_failure)}')
          text = text.replace(old_mixed_failure, new_mixed_failure, 1)

          # Capture protocol-gate failures before accounts disappear from later selection stages.
          old_snapshot = '''\t\tif err == nil {
          \t\t\t// 请求级 Custom 协议过滤（快照按 group/platform 缓存、跨入站 endpoint 共享，
          \t\t\t// 故协议过滤必须在此处按当前请求做）。
          \t\t\taccounts = filterAccountsByRequestProtocol(ctx, accounts)
          '''
          new_snapshot = '''\t\tif err == nil {
          \t\t\t// Group snapshots contain every schedulable upstream. The protocol router,
          \t\t\t// rather than group.platform, is the authority for message compatibility.
          \t\t\taccounts, err = filterAccountsByRequestProtocolForScheduling(ctx, groupID, platform, accounts)
          '''
          if text.count(old_snapshot) != 1:
              raise SystemExit(f'gateway snapshot protocol block expected one match, got {text.count(old_snapshot)}')
          text = text.replace(old_snapshot, new_snapshot, 1)

          old_group = '''\t\trawCount := len(accounts)
          \t\taccounts = filterAccountsByRequestProtocol(ctx, accounts)
          \tslog.Debug("account_scheduling_list",
          '''
          new_group = '''\t\trawCount := len(accounts)
          \t\taccounts, err = filterAccountsByRequestProtocolForScheduling(ctx, groupID, platform, accounts)
          \t\tif err != nil {
          \t\t\treturn nil, useMixed, err
          \t\t}
          \tslog.Debug("account_scheduling_list",
          '''
          if text.count(old_group) != 1:
              raise SystemExit(f'gateway grouped protocol block expected one match, got {text.count(old_group)}')
          text = text.replace(old_group, new_group, 1)

          old_final = '''\t// 请求级 Custom 协议过滤（按当前入站 endpoint 推导的 requiredProtocol）。
          \tfiltered = filterAccountsByRequestProtocol(ctx, filtered)
          \tslog.Debug("account_scheduling_list",
          '''
          new_final = '''\t// 请求级协议过滤（按当前入站 endpoint 推导）；如果全部账号在这里
          \t// 被淘汰，返回包含逐账号原因的错误，而不是无信息的空候选集。
          \tfiltered, err = filterAccountsByRequestProtocolForScheduling(ctx, groupID, platform, filtered)
          \tif err != nil {
          \t\treturn nil, useMixed, err
          \t}
          \tslog.Debug("account_scheduling_list",
          '''
          if text.count(old_final) != 1:
              raise SystemExit(f'gateway final protocol block expected one match, got {text.count(old_final)}')
          text = text.replace(old_final, new_final, 1)
          gateway.write_text(text)

          # Extend frontend diagnostics with request-time server records.
          p = Path('frontend/src/views/admin/ops/utils/errorAnalysis.ts')
          text = p.read_text()
          text = text.replace(
              "  | 'quota_auto_paused'\n",
              "  | 'quota_auto_paused'\n  | 'account_nil'\n  | 'excluded'\n  | 'custom_protocol_missing'\n  | 'protocol_incompatible'\n  | 'relay_mode_protocol_mismatch'\n  | 'protocol_conversion_unavailable'\n  | 'schedulable_disabled'\n  | 'privacy_required'\n  | 'channel_restricted'\n  | 'window_cost_exceeded'\n  | 'credentials_missing'\n", 1)
          text = text.replace(
              '''export interface ErrorAnalysisAccountReason {
          \tkey: ErrorAnalysisAccountReasonKey
          \tdetail?: string
          }
          ''',
              '''export interface ErrorAnalysisAccountReason {
          \tkey: ErrorAnalysisAccountReasonKey
          \tdetail?: string
          \tsource?: 'request_time' | 'current_state'
          }
          ''', 1)
          text = text.replace(
              '''export interface ErrorAnalysisAccountDiagnostic {
          \taccount: Account
          \tavailable: boolean
          \treasons: ErrorAnalysisAccountReason[]
          }
          ''',
              '''export interface ErrorAnalysisAccountDiagnostic {
          \taccount: Account
          \tavailable: boolean
          \treasons: ErrorAnalysisAccountReason[]
          \tsource?: 'request_time' | 'current_state'
          }
          
          interface RecordedSchedulerAccountDiagnostic {
          \taccount_id: number
          \tavailable: boolean
          \treason?: ErrorAnalysisAccountReasonKey
          \tdetail?: string
          }
          
          interface RecordedSchedulerDiagnostics {
          \tversion: number
          \tinbound_protocol?: string
          \trequested_model?: string
          \tgroup_id?: number
          \tplatform?: string
          \treason_counts?: Record<string, number>
          \taccounts?: RecordedSchedulerAccountDiagnostic[]
          }
          ''', 1)
          text = text.replace(
              "const NETWORK_RE = /timeout|deadline|connection refused|connection reset|dial tcp|tls|dns|network/i\n",
              "const NETWORK_RE = /timeout|deadline|connection refused|connection reset|dial tcp|tls|dns|network/i\nconst SCHEDULER_DIAGNOSTICS_RE = /scheduler_diagnostics=([A-Za-z0-9_-]+)/\n", 1)

          insert_after = '''function normalize(value: unknown): string {
          \treturn String(value ?? '').trim().toLowerCase()
          }
          '''
          parser = '''function normalize(value: unknown): string {
          \treturn String(value ?? '').trim().toLowerCase()
          }
          
          export function parseRecordedSchedulerDiagnostics(detail: OpsErrorDetail | OpsErrorLog | null | undefined): RecordedSchedulerDiagnostics | null {
          \tconst match = String(detail?.message || '').match(SCHEDULER_DIAGNOSTICS_RE)
          \tif (!match?.[1]) return null
          \ttry {
          \t\tconst normalized = match[1].replace(/-/g, '+').replace(/_/g, '/')
          \t\tconst padded = normalized + '='.repeat((4 - normalized.length % 4) % 4)
          \t\tconst binary = atob(padded)
          \t\tconst bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0))
          \t\treturn JSON.parse(new TextDecoder().decode(bytes)) as RecordedSchedulerDiagnostics
          \t} catch {
          \t\treturn null
          \t}
          }
          '''
          if text.count(insert_after) != 1:
              raise SystemExit('frontend normalize block mismatch')
          text = text.replace(insert_after, parser, 1)

          text = text.replace(
              '''\tcase 'account_scheduler':
          \t\tpushEvidence(evidence, 'account', detail.account_name || detail.account_id || 'none', detail.account_id ? 'neutral' : 'warning')
          \t\tpushEvidence(evidence, 'status', detail.status_code, detail.status_code >= 500 ? 'danger' : 'warning')
          \t\tif (hasNoAvailableAccount(detail)) pushEvidence(evidence, 'scheduler_result', 'No available accounts', 'danger')
          \t\tif (isCustomProviderContext(detail, upstreamErrors)) pushEvidence(evidence, 'provider_kind', 'custom', 'warning')
          \t\tbreak
          ''',
              '''\tcase 'account_scheduler': {
          \t\tpushEvidence(evidence, 'account', detail.account_name || detail.account_id || 'none', detail.account_id ? 'neutral' : 'warning')
          \t\tpushEvidence(evidence, 'status', detail.status_code, detail.status_code >= 500 ? 'danger' : 'warning')
          \t\tif (hasNoAvailableAccount(detail)) pushEvidence(evidence, 'scheduler_result', 'No available accounts', 'danger')
          \t\tif (isCustomProviderContext(detail, upstreamErrors)) pushEvidence(evidence, 'provider_kind', 'custom', 'warning')
          \t\tconst recorded = parseRecordedSchedulerDiagnostics(detail)
          \t\tif (recorded?.inbound_protocol) pushEvidence(evidence, 'inbound_protocol', recorded.inbound_protocol)
          \t\tif (recorded?.accounts) pushEvidence(evidence, 'evaluated_accounts', recorded.accounts.length)
          \t\tif (recorded?.reason_counts) {
          \t\t\tconst summary = Object.entries(recorded.reason_counts)
          \t\t\t\t.sort((a, b) => b[1] - a[1])
          \t\t\t\t.map(([reason, count]) => `${reason}:${count}`)
          \t\t\t\t.join(', ')
          \t\t\tpushEvidence(evidence, 'rejection_reasons', summary, 'danger')
          \t\t}
          \t\tbreak
          \t}
          ''', 1)

          marker = '''  const reasons: ErrorAnalysisAccountReason[] = []
          \tconst groupID = detail?.group_id ?? null
          '''
          replacement = '''  const recorded = parseRecordedSchedulerDiagnostics(detail)
          \tconst recordedAccount = recorded?.accounts?.find((item) => item.account_id === account.id)
          \tif (recordedAccount) {
          \t\tconst reasons: ErrorAnalysisAccountReason[] = []
          \t\tif (!recordedAccount.available && recordedAccount.reason) {
          \t\t\treasons.push({ key: recordedAccount.reason, detail: recordedAccount.detail, source: 'request_time' })
          \t\t}
          \t\treturn { account, available: recordedAccount.available, reasons, source: 'request_time' }
          \t}
          
          \tconst reasons: ErrorAnalysisAccountReason[] = []
          \tconst groupID = detail?.group_id ?? null
          '''
          if text.count(marker) != 1:
              raise SystemExit('frontend diagnose insertion mismatch')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '''  return {
          \t\taccount,
          \t\tavailable: reasons.length === 0,
          \t\treasons
          \t}
          }
          ''',
              '''  return {
          \t\taccount,
          \t\tavailable: reasons.length === 0,
          \t\treasons: reasons.map((reason) => ({ ...reason, source: 'current_state' })),
          \t\tsource: 'current_state'
          \t}
          }
          ''', 1)
          p.write_text(text)

          view = Path('frontend/src/views/admin/ops/ErrorAnalysisView.vue')
          text = view.read_text()
          old_label = '''function accountReasonLabel(reason: ErrorAnalysisAccountReason): string {
          \tconst translated = t(`admin.ops.errorAnalysis.schedulerAccounts.reason.${reason.key}`)
          \tconst base = translated !== `admin.ops.errorAnalysis.schedulerAccounts.reason.${reason.key}` ? translated : reason.key
          \treturn reason.detail ? `${base}: ${reason.detail}` : base
          }
          '''
          new_label = '''function accountReasonLabel(reason: ErrorAnalysisAccountReason): string {
          \tconst translated = t(`admin.ops.errorAnalysis.schedulerAccounts.reason.${reason.key}`)
          \tconst base = translated !== `admin.ops.errorAnalysis.schedulerAccounts.reason.${reason.key}` ? translated : reason.key
          \tconst source = reason.source === 'request_time' ? '[request-time]' : '[current-state]'
          \treturn reason.detail ? `${source} ${base}: ${reason.detail}` : `${source} ${base}`
          }
          '''
          if text.count(old_label) != 1:
              raise SystemExit('frontend reason label mismatch')
          view.write_text(text.replace(old_label, new_label, 1))
          PY

          cat > backend/internal/service/scheduler_diagnostics.go <<'EOF'
          package service

          import (
          	"context"
          	"encoding/base64"
          	"encoding/json"
          	"fmt"
          	"strings"
          	"time"
          )

          const schedulerDiagnosticsMarker = "scheduler_diagnostics="

          type schedulerAccountDiagnostic struct {
          	AccountID      int64  `json:"account_id"`
          	AccountName    string `json:"account_name,omitempty"`
          	Platform       string `json:"platform,omitempty"`
          	RelayMode      string `json:"relay_mode,omitempty"`
          	TargetProtocol string `json:"target_protocol,omitempty"`
          	Available      bool   `json:"available"`
          	Stage          string `json:"stage,omitempty"`
          	Reason         string `json:"reason,omitempty"`
          	Detail         string `json:"detail,omitempty"`
          }

          type schedulerDiagnosticsEnvelope struct {
          	Version         int                          `json:"version"`
          	InboundProtocol string                       `json:"inbound_protocol,omitempty"`
          	RequestedModel  string                       `json:"requested_model,omitempty"`
          	GroupID         int64                        `json:"group_id,omitempty"`
          	Platform        string                       `json:"platform,omitempty"`
          	ReasonCounts    map[string]int               `json:"reason_counts,omitempty"`
          	Accounts        []schedulerAccountDiagnostic `json:"accounts"`
          }

          func appendSchedulerDiagnostics(summary, encoded string) string {
          	encoded = strings.TrimSpace(encoded)
          	if encoded == "" {
          		return summary
          	}
          	return strings.TrimSpace(summary) + " " + schedulerDiagnosticsMarker + encoded
          }

          func encodeSchedulerDiagnostics(envelope schedulerDiagnosticsEnvelope) string {
          	if len(envelope.Accounts) == 0 {
          		return ""
          	}
          	payload, err := json.Marshal(envelope)
          	if err != nil {
          		return ""
          	}
          	return base64.RawURLEncoding.EncodeToString(payload)
          }

          func filterAccountsByRequestProtocolForScheduling(ctx context.Context, groupID *int64, platform string, accounts []Account) ([]Account, error) {
          	if len(accounts) == 0 {
          		return accounts, nil
          	}
          	filtered := make([]Account, 0, len(accounts))
          	rejections := make([]schedulerAccountDiagnostic, 0)
          	reasonCounts := map[string]int{}
          	for i := range accounts {
          		account := &accounts[i]
          		if accountMatchesRequestProtocol(ctx, account) {
          			filtered = append(filtered, accounts[i])
          			continue
          		}
          		diagnostic := protocolDiagnosticForAccount(ctx, account)
          		rejections = append(rejections, diagnostic)
          		reasonCounts[diagnostic.Reason]++
          	}
          	if len(filtered) > 0 || len(rejections) == 0 {
          		return filtered, nil
          	}
          	envelope := schedulerDiagnosticsEnvelope{
          		Version:         1,
          		InboundProtocol: InboundProtocolFromContext(ctx),
          		GroupID:         derefGroupID(groupID),
          		Platform:        platform,
          		ReasonCounts:    reasonCounts,
          		Accounts:        rejections,
          	}
          	return nil, fmt.Errorf("%w (%s)", ErrNoAvailableAccounts, appendSchedulerDiagnostics("all accounts rejected by protocol router", encodeSchedulerDiagnostics(envelope)))
          }

          func protocolDiagnosticForAccount(ctx context.Context, account *Account) schedulerAccountDiagnostic {
          	diagnostic := schedulerAccountDiagnostic{Available: false, Stage: "protocol_router"}
          	if account == nil {
          		diagnostic.Reason = "account_nil"
          		return diagnostic
          	}
          	diagnostic.AccountID = account.ID
          	diagnostic.AccountName = account.Name
          	diagnostic.Platform = account.EffectivePlatform()
          	diagnostic.RelayMode = account.RelayMode()
          	diagnostic.TargetProtocol = account.TargetProtocol()
          	decision, ok := ProtocolRouteDecisionForAccount(ctx, account)
          	if ok {
          		diagnostic.Available = true
          		diagnostic.Stage = "eligible"
          		return diagnostic
          	}
          	diagnostic.Detail = decision.FailureReason
          	switch {
          	case account.IsCustom() && strings.TrimSpace(account.CustomProtocol()) == "":
          		diagnostic.Reason = "custom_protocol_missing"
          	case account.RelayMode() == RelayModePassthrough || account.RelayMode() == RelayModeFullPassthrough:
          		diagnostic.Reason = "relay_mode_protocol_mismatch"
          	case strings.Contains(strings.ToLower(decision.FailureReason), "not implemented"):
          		diagnostic.Reason = "protocol_conversion_unavailable"
          	default:
          		diagnostic.Reason = "protocol_incompatible"
          	}
          	return diagnostic
          }

          func (s *GatewayService) encodeSchedulerSelectionDiagnostics(
          	ctx context.Context,
          	groupID *int64,
          	accounts []Account,
          	requestedModel string,
          	platform string,
          	excludedIDs map[int64]struct{},
          ) string {
          	if len(accounts) == 0 {
          		return ""
          	}
          	const maxAccounts = 50
          	limit := len(accounts)
          	if limit > maxAccounts {
          		limit = maxAccounts
          	}
          	diagnostics := make([]schedulerAccountDiagnostic, 0, limit)
          	reasonCounts := make(map[string]int)
          	for i := 0; i < limit; i++ {
          		diagnostic := s.schedulerSelectionDiagnostic(ctx, groupID, &accounts[i], requestedModel, excludedIDs)
          		diagnostics = append(diagnostics, diagnostic)
          		if diagnostic.Reason != "" {
          			reasonCounts[diagnostic.Reason]++
          		}
          	}
          	return encodeSchedulerDiagnostics(schedulerDiagnosticsEnvelope{
          		Version:         1,
          		InboundProtocol: InboundProtocolFromContext(ctx),
          		RequestedModel:  requestedModel,
          		GroupID:         derefGroupID(groupID),
          		Platform:        platform,
          		ReasonCounts:    reasonCounts,
          		Accounts:        diagnostics,
          	})
          }

          func (s *GatewayService) schedulerSelectionDiagnostic(ctx context.Context, groupID *int64, account *Account, requestedModel string, excludedIDs map[int64]struct{}) schedulerAccountDiagnostic {
          	if account == nil {
          		return schedulerAccountDiagnostic{Available: false, Stage: "account_state", Reason: "account_nil"}
          	}
          	diagnostic := schedulerAccountDiagnostic{
          		AccountID:      account.ID,
          		AccountName:    account.Name,
          		Platform:       account.EffectivePlatform(),
          		RelayMode:      account.RelayMode(),
          		TargetProtocol: account.TargetProtocol(),
          	}
          	reject := func(stage, reason, detail string) schedulerAccountDiagnostic {
          		diagnostic.Available = false
          		diagnostic.Stage = stage
          		diagnostic.Reason = reason
          		diagnostic.Detail = detail
          		return diagnostic
          	}

          	if _, excluded := excludedIDs[account.ID]; excluded {
          		return reject("request_exclusion", "excluded", "account was excluded by a previous attempt")
          	}
          	if route, ok := ProtocolRouteDecisionForAccount(ctx, account); !ok {
          		protocol := protocolDiagnosticForAccount(ctx, account)
          		return protocol
          	} else {
          		diagnostic.TargetProtocol = route.TargetProtocol
          	}
          	if !account.IsActive() {
          		return reject("account_state", "status_inactive", "status="+account.Status)
          	}
          	if !account.Schedulable {
          		return reject("account_state", "schedulable_disabled", "manual scheduling switch is off")
          	}
          	now := time.Now()
          	if account.AutoPauseOnExpired && account.ExpiresAt != nil && !now.Before(*account.ExpiresAt) {
          		return reject("account_state", "expired", account.ExpiresAt.Format(time.RFC3339))
          	}
          	if account.OverloadUntil != nil && now.Before(*account.OverloadUntil) {
          		return reject("account_state", "overloaded", account.OverloadUntil.Format(time.RFC3339))
          	}
          	if account.RateLimitResetAt != nil && now.Before(*account.RateLimitResetAt) {
          		return reject("account_state", "rate_limited", account.RateLimitResetAt.Format(time.RFC3339))
          	}
          	if account.TempUnschedulableUntil != nil && now.Before(*account.TempUnschedulableUntil) {
          		detail := account.TempUnschedulableUntil.Format(time.RFC3339)
          		if account.TempUnschedulableReason != "" {
          			detail = account.TempUnschedulableReason + "; until=" + detail
          		}
          		return reject("account_state", "temp_unschedulable", detail)
          	}
          	if account.IsAPIKeyOrBedrock() && account.IsQuotaExceeded() {
          		return reject("quota", "quota_exhausted", "account quota is exhausted")
          	}
          	if groupID != nil {
          		if group := s.groupFromContext(ctx, *groupID); group != nil && group.RequirePrivacySet && !account.IsPrivacySet() {
          			return reject("group_policy", "privacy_required", "group requires privacy to be configured")
          		}
          	}
          	if requestedModel != "" && !s.isModelSupportedByAccountWithContext(ctx, account, requestedModel) {
          		return reject("model_filter", "model_not_allowed", "model="+requestedModel)
          	}
          	if groupID != nil && s.needsUpstreamChannelRestrictionCheck(ctx, groupID) && s.isUpstreamModelRestrictedByChannel(ctx, *groupID, account, requestedModel) {
          		return reject("channel_policy", "channel_restricted", "upstream model is restricted by channel pricing policy")
          	}
          	if !s.isAccountSchedulableForModelSelection(ctx, account, requestedModel) {
          		remaining := account.GetRateLimitRemainingTimeWithContext(ctx, requestedModel).Truncate(time.Second)
          		return reject("model_rate_limit", "model_rate_limited", "remaining="+remaining.String())
          	}
          	if !s.isAccountSchedulableForQuota(account) {
          		return reject("quota", "quota_exhausted", "quota eligibility check rejected account")
          	}
          	if !s.isAccountSchedulableForWindowCost(ctx, account, false) {
          		return reject("window_cost", "window_cost_exceeded", "rolling window cost limit reached")
          	}
          	if !s.isAccountSchedulableForRPM(ctx, account, false) {
          		return reject("rpm", "rpm_limit", "account RPM limit reached")
          	}
          	if account.IsCustom() {
          		if strings.TrimSpace(account.GetCredential("base_url")) == "" || strings.TrimSpace(account.GetCredential("api_key")) == "" {
          			return reject("credentials", "credentials_missing", "custom account requires base_url and api_key")
          		}
          	}
          	diagnostic.Available = true
          	diagnostic.Stage = "eligible"
          	return diagnostic
          }
          EOF

          cat > backend/internal/service/account_custom_protocol_compat_test.go <<'EOF'
          package service

          import "testing"

          func TestCustomProtocolFallsBackToLegacyCredentials(t *testing.T) {
          	account := &Account{
          		Platform: PlatformCustom,
          		Credentials: map[string]any{
          			"protocol": CustomProtocolOpenAIResponses,
          		},
          	}
          	if got := account.CustomProtocol(); got != CustomProtocolOpenAIResponses {
          		t.Fatalf("CustomProtocol() = %q, want %q", got, CustomProtocolOpenAIResponses)
          	}
          	if _, ok := ProtocolRouteDecisionForAccountProtocols(CustomProtocolAnthropicMessages, account); !ok {
          		t.Fatal("legacy Custom OpenAI Responses account should be routable from Anthropic Messages")
          	}
          }

          func TestCustomProtocolPrefersAuthoritativeExtraField(t *testing.T) {
          	account := &Account{
          		Platform: PlatformCustom,
          		Extra: map[string]any{
          			"protocol": CustomProtocolAnthropicMessages,
          		},
          		Credentials: map[string]any{
          			"protocol": CustomProtocolOpenAIResponses,
          		},
          	}
          	if got := account.CustomProtocol(); got != CustomProtocolAnthropicMessages {
          		t.Fatalf("CustomProtocol() = %q, want authoritative extra value %q", got, CustomProtocolAnthropicMessages)
          	}
          }
          EOF

          cat > backend/internal/service/scheduler_diagnostics_test.go <<'EOF'
          package service

          import (
          	"context"
          	"encoding/base64"
          	"encoding/json"
          	"strings"
          	"testing"
          )

          func TestProtocolFilterReturnsRequestTimeDiagnostics(t *testing.T) {
          	ctx := WithInboundProtocol(context.Background(), CustomProtocolAnthropicMessages)
          	account := Account{
          		ID:          7,
          		Name:        "responses passthrough",
          		Platform:    PlatformCustom,
          		Status:      StatusActive,
          		Schedulable: true,
          		Extra: map[string]any{
          			"protocol":   CustomProtocolOpenAIResponses,
          			"relay_mode": RelayModeFullPassthrough,
          		},
          	}
          	_, err := filterAccountsByRequestProtocolForScheduling(ctx, nil, PlatformAnthropic, []Account{account})
          	if err == nil {
          		t.Fatal("expected protocol rejection error")
          	}
          	message := err.Error()
          	idx := strings.Index(message, schedulerDiagnosticsMarker)
          	if idx < 0 {
          		t.Fatalf("diagnostics marker missing from %q", message)
          	}
          	encoded := strings.Fields(message[idx+len(schedulerDiagnosticsMarker):])[0]
          	payload, decodeErr := base64.RawURLEncoding.DecodeString(encoded)
          	if decodeErr != nil {
          		t.Fatalf("decode diagnostics: %v", decodeErr)
          	}
          	var envelope schedulerDiagnosticsEnvelope
          	if err := json.Unmarshal(payload, &envelope); err != nil {
          		t.Fatalf("unmarshal diagnostics: %v", err)
          	}
          	if len(envelope.Accounts) != 1 || envelope.Accounts[0].Reason != "relay_mode_protocol_mismatch" {
          		t.Fatalf("unexpected diagnostics: %+v", envelope.Accounts)
          	}
          }
          EOF

          cat > backend/migrations/159_normalize_custom_protocol_location.sql <<'EOF'
          -- Normalize historical Custom account protocol storage.
          -- Older forms wrote protocol into credentials; the router reads extra.protocol.
          UPDATE accounts
          SET
              extra = jsonb_set(
                  COALESCE(extra, '{}'::jsonb),
                  '{protocol}',
                  to_jsonb(credentials->>'protocol'),
                  true
              ),
              credentials = COALESCE(credentials, '{}'::jsonb) - 'protocol',
              updated_at = NOW()
          WHERE platform = 'custom'
            AND COALESCE(extra->>'protocol', '') = ''
            AND credentials->>'protocol' IN (
                'openai_responses',
                'openai_chat_completions',
                'openai_embeddings',
                'anthropic_messages',
                'gemini'
            );
          EOF


name: Apply Full Repair

on:
  push:
    branches:
      - agent/complete-bug-audit-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-full-repair-pr21
  cancel-in-progress: true

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-bug-audit-fixes
          fetch-depth: 1
          persist-credentials: true

      - name: Reconstruct and verify repair patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/repair-payload/payload-* | tr -d '\r\n' > /tmp/lightbridge-repair.patch.gz.b64
          base64 --decode /tmp/lightbridge-repair.patch.gz.b64 | gzip --decompress > /tmp/lightbridge-repair.patch
          echo 'ebcd874863212b88d5fada344654ac06d66519d51803eca5d228ceefc247b183  /tmp/lightbridge-repair.patch' | sha256sum --check --strict
          git apply --check /tmp/lightbridge-repair.patch

      - name: Apply non-workflow repaired source
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/lightbridge-repair.patch

          # GitHub Actions tokens cannot create, update, or delete workflow files.
          # Leave workflow paths unchanged here; the connected GitHub app will
          # submit those files immediately after this source commit succeeds.
          git restore --source=HEAD --staged --worktree \
            .github/workflows/backend-ci.yml \
            .github/workflows/security-scan.yml
          git rm --cached --ignore-unmatch .github/workflows/runtime-environment-check.yml
          rm -f .github/workflows/runtime-environment-check.yml

          rm -rf .github/repair-payload
          git add --all
          git diff --cached --check

      - name: Commit and push repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden rollback and runtime support'
          git push origin HEAD:agent/complete-bug-audit-fixes
          {
            echo '## Non-workflow repair source applied'
            echo
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo 'Permanent workflow changes are submitted separately through the connected GitHub app.'
          } >> "$GITHUB_STEP_SUMMARY"

name: Bootstrap content distribution target

on:
  pull_request_target:
    branches:
      - agent/advanced-user-filter
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: bootstrap-content-distribution-target
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/content-distribution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/content-distribution
          fetch-depth: 0

      - name: Apply distribution wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          def insert_before(path, marker, content):
              replace_once(path, marker, content + marker)

          replace_once('backend/internal/service/wire.go', '\tNewAnnouncementService,\n', '\tNewAnnouncementService,\n\tNewDistributionService,\n')

          replace_once('backend/internal/handler/handler.go', '\tAnnouncement           *admin.AnnouncementHandler\n\tDataManagement', '\tAnnouncement           *admin.AnnouncementHandler\n\tDistribution           *admin.DistributionHandler\n\tDataManagement')
          replace_once('backend/internal/handler/handler.go', '\tAnnouncement     *AnnouncementHandler\n\tChannelMonitor', '\tAnnouncement     *AnnouncementHandler\n\tDistribution     *DistributionHandler\n\tChannelMonitor')

          replace_once('backend/internal/handler/wire.go', '\tannouncementHandler *admin.AnnouncementHandler,\n\tdataManagementHandler', '\tannouncementHandler *admin.AnnouncementHandler,\n\tdistributionHandler *admin.DistributionHandler,\n\tdataManagementHandler')
          replace_once('backend/internal/handler/wire.go', '\t\tAnnouncement:           announcementHandler,\n\t\tDataManagement:', '\t\tAnnouncement:           announcementHandler,\n\t\tDistribution:           distributionHandler,\n\t\tDataManagement:')
          replace_once('backend/internal/handler/wire.go', '\tannouncementHandler *AnnouncementHandler,\n\tchannelMonitorUserHandler', '\tannouncementHandler *AnnouncementHandler,\n\tdistributionHandler *DistributionHandler,\n\tchannelMonitorUserHandler')
          replace_once('backend/internal/handler/wire.go', '\t\tAnnouncement:     announcementHandler,\n\t\tChannelMonitor:', '\t\tAnnouncement:     announcementHandler,\n\t\tDistribution:     distributionHandler,\n\t\tChannelMonitor:')
          replace_once('backend/internal/handler/wire.go', '\tNewAnnouncementHandler,\n\tNewChannelMonitorUserHandler,', '\tNewAnnouncementHandler,\n\tNewDistributionHandler,\n\tNewChannelMonitorUserHandler,')
          replace_once('backend/internal/handler/wire.go', '\tadmin.NewAnnouncementHandler,\n\tadmin.NewDataManagementHandler,', '\tadmin.NewAnnouncementHandler,\n\tadmin.NewDistributionHandler,\n\tadmin.NewDataManagementHandler,')

          replace_once('backend/internal/server/routes/admin.go', '\t\tregisterUserManagementRoutes(admin, h)\n', '\t\tregisterUserManagementRoutes(admin, h)\n\t\tregisterDistributionRoutes(admin, h)\n')
          insert_before('backend/internal/server/routes/admin.go', 'func registerGroupRoutes(admin *gin.RouterGroup, h *handler.Handlers) {', '''func registerDistributionRoutes(admin *gin.RouterGroup, h *handler.Handlers) {
\tdistributions := admin.Group("/distributions")
\t{
\t\tdistributions.GET("", h.Admin.Distribution.List)
\t\tdistributions.POST("", h.Admin.Distribution.Create)
\t\tdistributions.POST("/batch", h.Admin.Distribution.BatchCreate)
\t\tdistributions.POST("/audience-preview", h.Admin.Distribution.PreviewAudience)
\t\tdistributions.GET("/:id", h.Admin.Distribution.Get)
\t\tdistributions.GET("/:id/download", h.Admin.Distribution.Download)
\t\tdistributions.DELETE("/:id", h.Admin.Distribution.Delete)
\t}
}

''')
          insert_before('backend/internal/server/routes/user.go', '\t\t// 公告（用户可见）\n', '''\t\t// 内容分发（用户收件箱）
\t\tdistributions := authenticated.Group("/distributions")
\t\t{
\t\t\tdistributions.GET("", h.Distribution.List)
\t\t\tdistributions.GET("/:id", h.Distribution.Get)
\t\t\tdistributions.POST("/:id/read", h.Distribution.MarkRead)
\t\t\tdistributions.GET("/:id/download", h.Distribution.Download)
\t\t}

''')

          for locale in ('en', 'zh'):
              path = f'frontend/src/i18n/locales/{locale}-sections/index.ts'
              replace_once(path, "import announcements from './announcements'\n", "import announcements from './announcements'\nimport distributions from './distributions'\n")
              replace_once(path, '  announcements,\n', '  announcements,\n  distributions,\n')

          replace_once('frontend/src/i18n/locales/en-sections/nav.ts', "    announcements: 'Announcements',\n", "    announcements: 'Announcements',\n    distributions: 'Distribution Center',\n")
          replace_once('frontend/src/i18n/locales/zh-sections/nav.ts', "    announcements: '公告',\n", "    announcements: '公告',\n    distributions: '分发中心',\n")

          insert_before('frontend/src/router/index.ts', "  {\n    path: '/profile',\n", '''  {
    path: '/distributions',
    name: 'Distributions',
    component: () => import('@/views/user/DistributionsView.vue'),
    meta: {
      requiresAuth: true,
      requiresAdmin: false,
      title: 'Distribution Center',
      titleKey: 'distributions.userTitle',
      descriptionKey: 'distributions.userDescription'
    }
  },
''')
          insert_before('frontend/src/router/index.ts', "  {\n    path: '/admin/groups',\n", '''  {
    path: '/admin/distributions',
    name: 'AdminDistributions',
    component: () => import('@/views/admin/DistributionsView.vue'),
    meta: {
      requiresAuth: true,
      requiresAdmin: true,
      title: 'Content Distribution',
      titleKey: 'distributions.adminTitle',
      descriptionKey: 'distributions.adminDescription'
    }
  },
''')

          replace_once('frontend/src/components/layout/AppSidebar.vue', "  if (withDashboard) {\n    items.push({ path: '/dashboard', label: t('nav.dashboard'), icon: DashboardIcon })\n  }\n\n  // API 与监控", "  if (withDashboard) {\n    items.push({ path: '/dashboard', label: t('nav.dashboard'), icon: DashboardIcon })\n  }\n\n  items.push({ path: '/distributions', label: t('nav.distributions'), icon: BellIcon })\n\n  // API 与监控")
          replace_once('frontend/src/components/layout/AppSidebar.vue', "      featureFlag: anyFlags(flagAffiliate, flagAnnouncements, flagRedeem, flagPromo),\n      children: [\n        { path: '/admin/announcements', label: t('nav.announcements'), icon: BellIcon, featureFlag: flagAnnouncements },", "      children: [\n        { path: '/admin/distributions', label: t('nav.distributions'), icon: BellIcon },\n        { path: '/admin/announcements', label: t('nav.announcements'), icon: BellIcon, featureFlag: flagAnnouncements },")
          PY

          gofmt -w \
            backend/internal/service/wire.go \
            backend/internal/handler/handler.go \
            backend/internal/handler/wire.go \
            backend/internal/server/routes/admin.go \
            backend/internal/server/routes/user.go

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Generate Wire dependency graph
        working-directory: backend
        run: go generate ./cmd/server

      - name: Commit wired implementation
        shell: bash
        run: |
          rm -f .github/workflows/agent-content-distribution.yml
          rm -f .github/workflows/agent-content-distribution-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(distribution): wire content distribution center"
          git push origin HEAD:agent/content-distribution

name: Verify console rendering fix

on:
  push:
    branches: [agent/diagnose-console-blank]

permissions:
  contents: read

concurrency:
  group: diagnose-console-blank
  cancel-in-progress: true

jobs:
  browser-login:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: LightBridge
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: LightBridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U LightBridge -d LightBridge"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    steps:
      - uses: actions/checkout@v6

      - name: Build and start fixed production image
        run: |
          set -euo pipefail
          docker build -t lightbridge:console-fix \
            --build-arg VERSION=console-fix \
            --build-arg COMMIT="$GITHUB_SHA" .
          docker run -d --name lightbridge --network host \
            -e AUTO_SETUP=true \
            -e LIGHTBRIDGE_DEPLOYMENT_TYPE=container \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=18080 \
            -e SERVER_MODE=release \
            -e RUN_MODE=standard \
            -e DATABASE_HOST=127.0.0.1 \
            -e DATABASE_PORT=5432 \
            -e DATABASE_USER=LightBridge \
            -e DATABASE_PASSWORD=test-password \
            -e DATABASE_DBNAME=LightBridge \
            -e DATABASE_SSLMODE=disable \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e ADMIN_EMAIL=console-test@example.invalid \
            -e ADMIN_PASSWORD=ConsoleTest123! \
            -e JWT_SECRET=test-jwt-secret-test-jwt-secret-test-jwt-secret-test-jwt-secret \
            -e TOTP_ENCRYPTION_KEY=test-totp-key-test-totp-key-test-totp-key-test-totp-key \
            lightbridge:console-fix
          for attempt in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:18080/health; then exit 0; fi
            sleep 3
          done
          docker logs lightbridge
          exit 1

      - name: Login and require rendered console
        run: |
          set -euo pipefail
          mkdir -p /tmp/console-result
          cat >/tmp/console-result/check.mjs <<'JS'
          import fs from 'node:fs/promises'
          import { chromium } from 'playwright'

          const errors = []
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
          page.on('pageerror', error => errors.push({ message: error.message, stack: error.stack || '' }))

          await page.goto('http://127.0.0.1:18080/login', { waitUntil: 'domcontentloaded' })
          await page.locator('#email').fill('console-test@example.invalid')
          await page.locator('#password').fill('ConsoleTest123!')
          await page.locator('button[type="submit"]').click()
          await page.waitForURL(/\/(?:admin\/)?dashboard(?:[/?#]|$)/, { timeout: 60000 })
          await page.waitForTimeout(10000)

          const result = await page.evaluate(() => ({
            url: location.href,
            rootChildren: document.querySelector('#app')?.children.length ?? 0,
            bodyTextLength: document.body.innerText.trim().length,
            sidebarCount: document.querySelectorAll('#lightbridge-sidebar, .sidebar').length,
            headerCount: document.querySelectorAll('.app-topbar').length,
            mainCount: document.querySelectorAll('main.app-main').length,
          }))
          await page.screenshot({ path: '/work/console.png', fullPage: true })
          await fs.writeFile('/work/result.json', JSON.stringify({ result, errors }, null, 2))
          console.log(JSON.stringify({ result, errors }, null, 2))
          await browser.close()

          if (errors.length || result.rootChildren === 0 || result.bodyTextLength < 50 || result.sidebarCount === 0 || result.headerCount === 0 || result.mainCount === 0) process.exit(1)
          JS
          docker run --rm --network host -v /tmp/console-result:/work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'cd /tmp && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.55.0 >/dev/null && node /work/check.mjs'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-rendering-fix
          path: /tmp/console-result
          if-no-files-found: warn
          retention-days: 2

      - name: Show app logs
        if: failure()
        run: docker logs lightbridge || true

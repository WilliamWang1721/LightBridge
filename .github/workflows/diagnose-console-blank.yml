name: Verify console rendering fix

on:
  push:
    branches:
      - agent/diagnose-console-blank

permissions:
  contents: read

concurrency:
  group: diagnose-console-blank
  cancel-in-progress: true

jobs:
  browser-login:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_IMAGE: lightbridge:console-fix
      BASE_URL: http://127.0.0.1:18080
      ADMIN_EMAIL: console-diagnostic@lightbridge.local
      ADMIN_PASSWORD: LightBridge-Console-Diagnostic-2026!
      OUTPUT_DIR: /tmp/console-diagnostic
      COMPOSE_PROJECT_NAME: lb-console-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6

      - name: Build the fixed production image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --tag "$TARGET_IMAGE" \
            --build-arg VERSION=console-fix \
            --build-arg COMMIT="$GITHUB_SHA" \
            .

      - name: Start the fixed image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cat >/tmp/console-diagnostic-compose.yml <<'YAML'
          services:
            postgres:
              image: postgres:17-alpine
              environment:
                POSTGRES_USER: LightBridge
                POSTGRES_PASSWORD: LightBridge-console-postgres-2026
                POSTGRES_DB: LightBridge
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U LightBridge -d LightBridge"]
                interval: 2s
                timeout: 5s
                retries: 60
            redis:
              image: redis:7-alpine
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                timeout: 5s
                retries: 60
            app:
              image: ${TARGET_IMAGE:?TARGET_IMAGE is required}
              pull_policy: never
              ports:
                - "127.0.0.1:18080:8080"
              environment:
                AUTO_SETUP: "true"
                LIGHTBRIDGE_DEPLOYMENT_TYPE: container
                SERVER_HOST: 0.0.0.0
                SERVER_PORT: "8080"
                SERVER_MODE: release
                RUN_MODE: standard
                DATABASE_HOST: postgres
                DATABASE_PORT: "5432"
                DATABASE_USER: LightBridge
                DATABASE_PASSWORD: LightBridge-console-postgres-2026
                DATABASE_DBNAME: LightBridge
                DATABASE_SSLMODE: disable
                REDIS_HOST: redis
                REDIS_PORT: "6379"
                REDIS_PASSWORD: ""
                REDIS_DB: "0"
                ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
                ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
                JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
                TOTP_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
                TZ: UTC
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "wget", "-q", "-T", "5", "-O", "-", "http://127.0.0.1:8080/health"]
                interval: 3s
                timeout: 6s
                retries: 80
          YAML

          docker compose -f /tmp/console-diagnostic-compose.yml up -d --wait --wait-timeout 240
          curl --fail --silent --show-error "$BASE_URL/health" | tee "$OUTPUT_DIR/health.json"

      - name: Login through Chromium and require a rendered console
        shell: bash
        run: |
          set -euo pipefail
          cat >"$OUTPUT_DIR/diagnose.mjs" <<'JS'
          import fs from 'node:fs/promises'
          import { chromium } from 'playwright'

          const baseURL = process.env.BASE_URL
          const outputDir = process.env.OUTPUT_DIR
          const pageErrors = []
          const failedRequests = []
          const errorResponses = []
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })

          page.on('pageerror', error => pageErrors.push({ message: error.message, stack: error.stack || '' }))
          page.on('requestfailed', request => failedRequests.push({
            url: request.url(),
            method: request.method(),
            resourceType: request.resourceType(),
            failure: request.failure()?.errorText || 'unknown',
          }))
          page.on('response', response => {
            if (response.status() >= 400) errorResponses.push({
              url: response.url(),
              status: response.status(),
              resourceType: response.request().resourceType(),
            })
          })

          await page.goto(`${baseURL}/login`, { waitUntil: 'domcontentloaded', timeout: 60000 })
          await page.locator('#email').fill(process.env.ADMIN_EMAIL)
          await page.locator('#password').fill(process.env.ADMIN_PASSWORD)
          await page.locator('button[type="submit"]').click()
          await page.waitForURL(/\/admin\/dashboard(?:[/?#]|$)/, { timeout: 60000 })
          await page.waitForTimeout(10000)

          const structure = await page.evaluate(() => {
            const root = document.querySelector('#app')
            return {
              url: location.href,
              rootChildren: root?.children.length ?? 0,
              bodyTextLength: document.body.innerText.trim().length,
              sidebarCount: document.querySelectorAll('#lightbridge-sidebar, .sidebar').length,
              headerCount: document.querySelectorAll('.app-topbar').length,
              mainCount: document.querySelectorAll('main.app-main').length,
            }
          })

          await page.screenshot({ path: `${outputDir}/console.png`, fullPage: true })
          const result = { structure, pageErrors, failedRequests, errorResponses }
          await fs.writeFile(`${outputDir}/result.json`, JSON.stringify(result, null, 2))
          console.log(JSON.stringify(result, null, 2))
          await browser.close()

          if (
            pageErrors.length ||
            !structure.url.includes('/admin/dashboard') ||
            structure.rootChildren === 0 ||
            structure.sidebarCount === 0 ||
            structure.headerCount === 0 ||
            structure.mainCount === 0 ||
            structure.bodyTextLength < 50
          ) process.exit(1)
          JS

          docker run --rm --network host \
            -e BASE_URL -e ADMIN_EMAIL -e ADMIN_PASSWORD -e OUTPUT_DIR \
            -v "$OUTPUT_DIR:/work" \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'set -euo pipefail; mkdir -p /tmp/diag; cp /work/diagnose.mjs /tmp/diag/; cd /tmp/diag; npm init -y >/dev/null; npm install --no-audit --no-fund playwright@1.55.0 >/dev/null; node diagnose.mjs'

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          docker compose -f /tmp/console-diagnostic-compose.yml logs --no-color >"$OUTPUT_DIR/compose.log" 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-rendering-fix
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 2

      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose -f /tmp/console-diagnostic-compose.yml down --volumes --remove-orphans || true

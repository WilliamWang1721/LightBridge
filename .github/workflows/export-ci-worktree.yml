name: Apply CI Lint Fixes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-ci-lint-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-bug-audit-fixes
          fetch-depth: 1
          persist-credentials: true
      - name: Verify and apply lint fixes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ci-lint-fixes.patch.b64 <<'PATCH'
          
          PATCH
          sed 's/^[[:space:]]*//' /tmp/ci-lint-fixes.patch.b64 | base64 --decode > /tmp/ci-lint-fixes.patch
          echo 'bbdc1784ed8e788bc44a6a0386fe800768e26e1e65db050afd188ae3f92bfb84  /tmp/ci-lint-fixes.patch' | sha256sum --check --strict
          git apply --check /tmp/ci-lint-fixes.patch
          git apply --index /tmp/ci-lint-fixes.patch
          git diff --cached --check
      - name: Commit and push lint fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): clear current Go lint failures'
          git push origin HEAD:agent/complete-bug-audit-fixes

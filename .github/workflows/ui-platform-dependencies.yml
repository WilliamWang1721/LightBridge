name: Install UI platform dependencies

on:
  push:
    branches:
      - agent/ui-platform-execution
    paths:
      - .github/ui-platform-deps.trigger

permissions:
  contents: write

concurrency:
  group: ui-platform-dependencies
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/ui-platform-execution
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install trusted UI dependencies
        working-directory: frontend
        run: |
          pnpm remove lucide-vue-next
          pnpm add @fontsource-variable/inter @lucide/vue reka-ui class-variance-authority clsx tailwind-merge

      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(ui): add self-hosted Inter variable font [skip ci]"
          git push origin HEAD:agent/ui-platform-execution

name: Start v0.3.62 release

on:
  push:
    branches:
      - agent/release-v0.3.62
    paths:
      - .github/workflows/start-v0362-release.yml

permissions:
  contents: write
  actions: write

jobs:
  start-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        env:
          TARGET_SHA: d277d88a4a58e455b9be3764e30df6c24be4bab5
          TAG_NAME: v0.3.62
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test "$(git show "$TARGET_SHA:backend/cmd/server/VERSION" | tr -d '\r\n')" = "0.3.61"
          ! git show "$TARGET_SHA:frontend/vite.config.ts" | grep -q 'manualChunks'
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            test "$(git rev-list -n 1 "$TAG_NAME^{commit}")" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" "$TARGET_SHA" -m "LightBridge v0.3.62" -m "Fix the frontend production bundle initialization cycle that caused blank pages in v0.3.6 and v0.3.61."
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Dispatch official release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.3.62
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref=main \
            -f "inputs[tag]=$TAG_NAME" \
            -F "inputs[simple_release]=false"

name: Repair and Re-dispatch v0.3.5 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-triggers/v0.3.5-repair'

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-release-v0.3.5
  cancel-in-progress: false

jobs:
  repair-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG_NAME: v0.3.5
      BASE_SHA: bba126145ed832b872100d97378399cd7d1e690d
      RELEASE_BRANCH: release/v0.3.5-inventory-fix
    steps:
      - name: Checkout clean release repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Regenerate and verify codebase inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/codebase_inventory.py
          python3 tools/codebase_inventory.py --check
          make secret-scan
          git diff --check

      - name: Commit inventory-only repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/CODEBASE_INVENTORY.tsv
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): refresh codebase inventory for v0.3.5'
            git push origin "HEAD:${RELEASE_BRANCH}"
          fi

          release_sha="$(git rev-parse HEAD)"
          changed="$(git diff --name-only "${BASE_SHA}..${release_sha}")"
          if [ "$changed" != 'docs/architecture/CODEBASE_INVENTORY.tsv' ]; then
            echo 'Release repair branch contains changes other than the inventory:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Move annotated v0.3.5 tag to repaired immutable source
        shell: bash
        run: |
          set -euo pipefail
          release_sha='${{ steps.repair.outputs.release_sha }}'
          git fetch --force origin --tags
          git tag -fa "$TAG_NAME" "$release_sha" -m "Release ${TAG_NAME}"
          git push --force origin "refs/tags/${TAG_NAME}"
          actual_sha="$(git rev-list -n 1 "${TAG_NAME}^{commit}")"
          test "$actual_sha" = "$release_sha"

      - name: Dispatch full Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"tag":"v0.3.5","simple_release":"false"}}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --data "$payload"

      - name: Record repaired tag
        shell: bash
        run: |
          {
            echo '## Repaired v0.3.5 release source'
            echo
            echo "- Base merge: ${BASE_SHA}"
            echo "- Release source: ${{ steps.repair.outputs.release_sha }}"
            echo "- Only changed file: docs/architecture/CODEBASE_INVENTORY.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

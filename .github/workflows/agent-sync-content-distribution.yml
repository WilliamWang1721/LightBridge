name: Sync content distribution with main

on:
  push:
    branches:
      - agent/content-distribution
    paths:
      - .github/workflows/agent-sync-content-distribution.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-sync-content-distribution
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/content-distribution
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

      - name: Merge latest main and resolve reviewed conflict
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "frontend/src/main.ts" ]; then
              echo "::error::Unexpected merge conflicts"
              printf '%s\n' "$conflicts"
              git diff --cc
              exit 1
            fi

            git checkout --theirs -- frontend/src/main.ts
            python3 <<'PY'
          from pathlib import Path

          path = Path('frontend/src/main.ts')
          text = path.read_text()

          import_anchor = "import { initializeChartTheme } from '@/ui-platform/chartTheme'\n"
          distribution_import = """import {
            installDistributionNavigation,
            installDistributionRoutes
          } from '@/distribution/runtime'
          """
          if distribution_import not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('chart theme import anchor not found exactly once')
              text = text.replace(import_anchor, import_anchor + distribution_import, 1)

          route_anchor = "  initializeChartTheme()\n"
          route_install = "  installDistributionRoutes(router)\n"
          if route_install not in text:
              if text.count(route_anchor) != 1:
                  raise SystemExit('chart theme initialization anchor not found exactly once')
              text = text.replace(route_anchor, route_anchor + route_install, 1)

          mount_anchor = "  app.mount('#app')\n"
          navigation_install = "  installDistributionNavigation(router)\n"
          if navigation_install not in text:
              if text.count(mount_anchor) != 1:
                  raise SystemExit('app mount anchor not found exactly once')
              text = text.replace(mount_anchor, mount_anchor + navigation_install, 1)

          path.write_text(text)
          PY
            git add frontend/src/main.ts
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Renumber distribution migration
        run: |
          test -f backend/migrations/140_content_distributions.sql
          test ! -e backend/migrations/163_content_distributions.sql
          git mv backend/migrations/140_content_distributions.sql backend/migrations/163_content_distributions.sql

      - name: Preserve personalized audience overrides
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('backend/internal/service/distribution.go')
          text = path.read_text()
          old = '''\t\trecipients[user.ID] = DistributionRecipient{
          \t\t\tUserID:          user.ID,
          \t\t\tTitleOverride:   strings.TrimSpace(titleOverride),
          \t\t\tContentOverride: strings.TrimSpace(contentOverride),
          \t\t}
          '''
          new = '''\t\trecipients[user.ID] = mergeDistributionRecipient(
          \t\t\trecipients[user.ID],
          \t\t\tuser.ID,
          \t\t\ttitleOverride,
          \t\t\tcontentOverride,
          \t\t)
          '''
          if text.count(old) != 1:
              raise SystemExit('recipient merge block not found exactly once')
          text = text.replace(old, new, 1)

          anchor = 'type DistributionImportLine struct {\n'
          helper = '''func mergeDistributionRecipient(existing DistributionRecipient, userID int64, titleOverride, contentOverride string) DistributionRecipient {
          \ttitleOverride = strings.TrimSpace(titleOverride)
          \tcontentOverride = strings.TrimSpace(contentOverride)
          \tif titleOverride == "" {
          \t\ttitleOverride = existing.TitleOverride
          \t}
          \tif contentOverride == "" {
          \t\tcontentOverride = existing.ContentOverride
          \t}
          \treturn DistributionRecipient{
          \t\tUserID:          userID,
          \t\tTitleOverride:   titleOverride,
          \t\tContentOverride: contentOverride,
          \t}
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('distribution import line anchor not found exactly once')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY

          cat > backend/internal/service/distribution_recipient_merge_test.go <<'EOF'
          package service

          import (
          	"testing"

          	"github.com/stretchr/testify/require"
          )

          func TestMergeDistributionRecipientPreservesPersonalization(t *testing.T) {
          	personalized := mergeDistributionRecipient(
          		DistributionRecipient{},
          		42,
          		"Personal title",
          		"Personal content",
          	)

          	mergedFromBroadAudience := mergeDistributionRecipient(personalized, 42, "", "")
          	require.Equal(t, personalized, mergedFromBroadAudience)

          	updatedTitle := mergeDistributionRecipient(mergedFromBroadAudience, 42, "Updated title", "")
          	require.Equal(t, "Updated title", updatedTitle.TitleOverride)
          	require.Equal(t, "Personal content", updatedTitle.ContentOverride)
          }
          EOF

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format and test distribution backend
        run: |
          gofmt -w \
            backend/internal/handler/admin/distribution_handler.go \
            backend/internal/handler/admin/distribution_handler_test.go \
            backend/internal/handler/distribution_handler.go \
            backend/internal/handler/distribution_handler_test.go \
            backend/internal/repository/aes_encryptor.go \
            backend/internal/repository/distribution_repo.go \
            backend/internal/repository/distribution_runtime.go \
            backend/internal/repository/wire.go \
            backend/internal/server/router.go \
            backend/internal/server/routes/distribution.go \
            backend/internal/service/distribution.go \
            backend/internal/service/distribution_test.go \
            backend/internal/service/distribution_recipient_merge_test.go
          cd backend
          go test ./internal/service ./internal/repository ./internal/handler ./internal/handler/admin ./internal/server ./internal/server/routes

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run repository frontend CI contract
        run: make test-frontend

      - name: Test distribution runtime and build production bundle
        run: |
          pnpm --dir frontend exec vitest run src/distribution/runtime.test.ts
          pnpm --dir frontend run build

      - name: Commit verified merge
        run: |
          rm .github/workflows/agent-sync-content-distribution.yml
          git add -A
          git diff --cached --check
          git commit -m "Merge main into agent/content-distribution"
          git push origin HEAD:agent/content-distribution

name: Repair and retry v0.3.61 release

on:
  push:
    branches: [agent/release-v0.3.61]
    paths: [.github/workflows/publish-v0361.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-release-v0.3.61
  cancel-in-progress: false

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Repair committed VERSION handling
        env:
          EXPECTED_MAIN: 4645a1e9dc6c03f36efe2e5f8a5bf728a0b4eca5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          old = '''          test "$(git status --short --untracked-files=no -- backend/cmd/server/VERSION)" = " M backend/cmd/server/VERSION"
          test -z "$(git status --short --untracked-files=no -- . ':(exclude)backend/cmd/server/VERSION')"
          git update-index --assume-unchanged backend/cmd/server/VERSION
          test -z "$(git status --short --untracked-files=no)"
'''
          new = '''          version_status="$(git status --short --untracked-files=no -- backend/cmd/server/VERSION)"
          case "$version_status" in
            ""|" M backend/cmd/server/VERSION") ;;
            *) echo "Unexpected VERSION worktree state: $version_status" >&2; exit 1 ;;
          esac
          test -z "$(git status --short --untracked-files=no -- . ':(exclude)backend/cmd/server/VERSION')"
          if [ -n "$version_status" ]; then
            git update-index --assume-unchanged backend/cmd/server/VERSION
          fi
          test -z "$(git status --short --untracked-files=no)"
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one VERSION-state block, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- .github/workflows/release.yml

      - name: Commit release workflow repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git commit -m "fix: accept committed VERSION in release workflow [skip ci]"
          git push origin HEAD:main

      - name: Verify immutable release tag
        run: |
          set -euo pipefail
          git fetch origin refs/tags/v0.3.61:refs/tags/v0.3.61 --force
          test "$(git rev-list -n 1 'v0.3.61^{commit}')" = "4645a1e9dc6c03f36efe2e5f8a5bf728a0b4eca5"

      - name: Dispatch repaired release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"tag":"v0.3.61","simple_release":"false"}}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            --data "$payload"

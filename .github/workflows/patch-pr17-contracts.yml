name: Patch PR17 Contracts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/universal-router-diagnostics-phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: false
      - name: Patch and verify contract fixtures
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/internal/server/api_contract_test.go')
          text = path.read_text()
          if '"peak_rate_enabled": false' not in text:
              pattern = re.compile(
                  r'(?m)^([ \t]*)"name": "Group One",\n([ \t]*)"description": "desc",\n([ \t]*)"platform": "anthropic",'
              )
              def repl(m):
                  i1, i2, i3 = m.groups()
                  return (
                      f'{i1}"name": "Group One",\n'
                      f'{i2}"description": "desc",\n'
                      f'{i3}"peak_end": "",\n'
                      f'{i3}"peak_rate_enabled": false,\n'
                      f'{i3}"peak_rate_multiplier": 0,\n'
                      f'{i3}"peak_start": "",\n'
                      f'{i3}"platform": "anthropic",'
                  )
              text, count = pattern.subn(repl, text, count=1)
              if count != 1:
                  raise SystemExit(f'group fixture count={count}')

          group_start = text.index('"name": "Group One"')
          group_close = text.index('\n\t\t\t\t\t}', group_start)
          fragment = text[group_start:group_close]
          if '"upstream_protocols": null' not in fragment:
              updated = text.index('"updated_at": "2025-01-02T03:04:05Z"', group_start, group_close)
              line_end = text.index('\n', updated)
              indent_start = text.rfind('\n', group_start, updated) + 1
              indent = text[indent_start:updated]
              text = text[:line_end] + ',\n' + indent + '"upstream_protocols": null' + text[line_end:]

          if '"announcements_enabled": false,' not in text:
              text = text.replace(
                  '"available_channels_enabled": false,',
                  '"announcements_enabled": false,\n'
                  '\t\t\t\t"promo_enabled": false,\n'
                  '\t\t\t\t"redeem_enabled": false,\n'
                  '\t\t\t\t"available_channels_enabled": false,',
              )

          quota_pattern = re.compile(
              r'("default_platform_quotas"\s*:\s*\{)(.*?)(\n\s*\},\n\s*"default_subscriptions")',
              re.S,
          )
          def quota_repl(m):
              body = m.group(2)
              indent_match = re.search(r'\n(\s*)"[^"]+"\s*:', body)
              if not indent_match:
                  raise SystemExit('quota indentation not found')
              indent = indent_match.group(1)
              additions = []
              if '"custom"' not in body:
                  additions.append(f'{indent}"custom": {{"daily": null, "monthly": null, "weekly": null}}')
              if '"grok"' not in body:
                  additions.append(f'{indent}"grok": {{"daily": null, "monthly": null, "weekly": null}}')
              if additions:
                  body = body.rstrip() + ',\n' + ',\n'.join(additions)
              return m.group(1) + body + m.group(3)
          text, count = quota_pattern.subn(quota_repl, text)
          if count < 2:
              raise SystemExit(f'quota fixture count={count}')

          path.write_text(text)
          PY
          cd backend
          gofmt -w internal/server/api_contract_test.go
          go test -tags=unit ./internal/server
          cd ..
          git config user.name 'openai-ci-fixer'
          git config user.email 'openai-ci-fixer@users.noreply.github.com'
          git add backend/internal/server/api_contract_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'test: synchronize API contract fixtures'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

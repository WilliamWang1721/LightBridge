name: Monitor v0.3.6 release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  monitor-release:
    if: github.event.pull_request.head.ref == 'release/v0.3.6-trigger'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 2e830edb2ae28fe147c659f28141e4149fd0e925
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Wait for definitive Release result
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=30" --jq ".workflow_runs | map(select((.head_branch == \"v0.3.6\") or (.head_sha == \"${RELEASE_SHA}\" and .event == \"push\"))) | first | .id // empty")"
            if [ -z "$RUN_ID" ]; then
              echo "Release run not visible yet (${attempt}/80)"
              sleep 15
              continue
            fi

            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .status)"
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion // "pending"')"
            echo "Release run ${RUN_ID}: ${STATUS}/${CONCLUSION}"

            if [ "$STATUS" != "completed" ]; then
              sleep 15
              continue
            fi

            BODY="v0.3.6 Release workflow completed. Run ID: ${RUN_ID}. Conclusion: ${CONCLUSION}. Immutable source: ${RELEASE_SHA}."
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null

            if [ "$CONCLUSION" != "success" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | [.name, .conclusion] | @tsv'
              exit 1
            fi
            exit 0
          done

          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="Timed out waiting for the v0.3.6 Release workflow for ${RELEASE_SHA}." >/dev/null
          exit 1

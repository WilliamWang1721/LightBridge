name: Apply Provider-Neutral Review Fixes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-provider-neutral-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/complete-bug-audit-fixes
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} occurrences, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new))

          def replace_in_section(path, start, end, old, new):
              text = read(path)
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              section = text[start_index:end_index]
              count = section.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence in section {start!r}, found {count}')
              section = section.replace(old, new, 1)
              write(path, text[:start_index] + section + text[end_index:])

          # Version-manager tests: feature-disabled exits before version lookup;
          # update attempts perform one lookup to attach backup metadata.
          replace_once(
              'backend/internal/handler/admin/system_handler_test.go',
              '\trequire.Zero(t, updateSvc.rollbackCall)\n\trequire.Equal(t, []bool{false}, updateSvc.checkForces)',
              '\trequire.Zero(t, updateSvc.rollbackCall)\n\trequire.Empty(t, updateSvc.checkForces)',
          )
          replace_once(
              'backend/internal/handler/admin/system_handler_test.go',
              '\trequire.Equal(t, 1, updateSvc.performCall)\n\trequire.Empty(t, updateSvc.checkForces)\n\trequireSystemLockStatus(t, repo, service.IdempotencyStatusFailedRetryable)',
              '\trequire.Equal(t, 1, updateSvc.performCall)\n\trequire.Equal(t, []bool{false}, updateSvc.checkForces)\n\trequireSystemLockStatus(t, repo, service.IdempotencyStatusFailedRetryable)',
          )

